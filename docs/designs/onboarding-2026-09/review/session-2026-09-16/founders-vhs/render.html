<!doctype html><meta charset="utf-8"><title>Founders · Events VHS render studio</title><style>body{background:#141714;color:#f4eee3;font:18px system-ui;padding:30px}button{padding:16px;background:#f05a3c;border:0;border-radius:9px;font:inherit}section{display:flex;gap:24px}canvas{width:210px;height:auto}video{display:none}output{display:block;margin:20px 0}</style><h1>Founders · original Events tape effect</h1><p>Three eight-second samples. Same picture, same cleaned audio, the original Events shader. No generation credits.</p><button id="render">Render the three clips</button><output id="status">Ready</output><section><div><h2>A · Heavy wear</h2><canvas id="a" width="540" height="960"></canvas></div><div><h2>B · Between</h2><canvas id="b" width="540" height="960"></canvas></div><div><h2>C · Events 03C</h2><canvas id="c" width="540" height="960"></canvas></div></section><video id="source" src="../founders-video/founders-welcome-cleaned.mp4" preload="auto" muted playsinline></video><script src="events-tape-shader.js"></script><script>
const source=document.getElementById('source'),status=document.getElementById('status'),button=document.getElementById('render');const profiles=[['a',.62],['b',.82],['c',1]].map(([id,damage])=>({id,damage,canvas:document.getElementById(id),draw:createTapeRenderer(document.getElementById(id))}));
async function post(path,body){const r=await fetch(path,{method:'POST',body});if(!r.ok)throw new Error(await r.text());return r.json()}
button.onclick=async()=>{button.disabled=true;try{if(source.readyState<2)await new Promise((resolve,reject)=>{source.addEventListener('loadeddata',resolve,{once:true});source.addEventListener('error',reject,{once:true})});source.pause();for(const p of profiles)await post('/start/'+p.id);for(let n=0;n<192;n++){const t=n/24;const decoded=new Image();decoded.src='source-frames/'+String(n).padStart(3,'0')+'.png';await decoded.decode();for(const p of profiles){p.draw(decoded,t+p.damage*.17,p.damage,false);const blob=await new Promise(resolve=>p.canvas.toBlob(resolve,'image/png'));await post('/frame/'+p.id+'/'+n,blob)}status.value=`Rendering ${n+1} / 192 frames · three treatments`;if(n%12===0)await new Promise(resolve=>setTimeout(resolve,0))}for(const p of profiles)await post('/finish/'+p.id);status.value='Done — all three actual clips exported with the original cleaned audio';document.body.dataset.renderComplete='true'}catch(e){status.value='Export error: '+e.message;button.disabled=false}};
</script>
