<!doctype html><meta charset="utf-8"><title>Full selected C export</title><style>body{background:#141714;color:#f4eee3;font:18px system-ui;padding:30px}button{padding:16px;background:#f05a3c;border:0;font:inherit}canvas{display:block;width:270px;margin-top:24px}output{display:block;margin-top:20px}</style><h1>Full founders video · selected C</h1><p>The exact approved Events shader. Complete cleaned audio and outtake. No generation credits.</p><button id="render">Render full C</button><output id="status">Ready</output><canvas id="picture" width="540" height="960"></canvas><script src="events-tape-shader.js"></script><script>
const button=document.getElementById('render'),status=document.getElementById('status'),canvas=document.getElementById('picture'),draw=createTapeRenderer(canvas);
async function post(path,body){const r=await fetch(path,{method:'POST',body});if(!r.ok)throw Error(await r.text());return r.json()}
button.onclick=async()=>{button.disabled=true;try{await post('/start');for(let n=0;n<2184;n++){const img=new Image();img.src='/source-frame/'+n;await img.decode();draw(img,n/24+.17,1,false);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));await post('/frame/'+n,blob);img.src='';status.value=`Rendering ${n+1} / 2184`;if(n%12===0)await new Promise(resolve=>setTimeout(resolve,0))}await post('/finish');status.value='Full C complete · audio verified unchanged';document.body.dataset.renderComplete='true'}catch(e){status.value='Error: '+e.message}};
</script>
