name: Wander
options:
  bundleIdPrefix: com.grayline
  settingPresets: none
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: Y7TVK75RZ8
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "169"
    WANDER_CLERK_FRONTEND_API: clerk.getrec.me
    WANDER_META_APP_ID: "1056841943950470"
    WANDER_SNAPCHAT_CLIENT_ID: 9ff6b79b-97ce-435c-bf7a-5176638246a0
    WANDER_SUPABASE_URL: https://rugmtlgufrhlxwfkumhw.supabase.co
    WANDER_TIKTOK_CLIENT_KEY: sbawa5efdmmcvrudh7
packages:
  posthog-ios:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.59.3
  clerk-ios:
    url: https://github.com/clerk/clerk-ios
    from: 1.5.0
  supabase-swift:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.46.0
  tiktok-opensdk-ios:
    url: https://github.com/tiktok/tiktok-opensdk-ios
    from: 2.5.0
schemes:
  Wander:
    build:
      targets:
        Wander: all
        WanderShareExtension: all
        WanderWidgets: all
        WanderNearbyWidgets: all
        WanderTests: [test]
        WanderUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WanderTests
        - WanderUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  Wander:
    type: application
    platform: iOS
    sources:
      - Wander
      - WanderImportShared
      - WanderWidgetShared
      - WanderControlShared
    configFiles:
      Debug: Wander/Config/Auth.xcconfig
      Release: Wander/Config/Auth.xcconfig
    info:
      path: Wander/Resources/Info.plist
      properties:
        WANDER_CLERK_FRONTEND_API: $(WANDER_CLERK_FRONTEND_API)
        WANDER_CLERK_PUBLISHABLE_KEY: $(WANDER_CLERK_PUBLISHABLE_KEY)
        WANDER_POSTHOG_HOST: $(WANDER_POSTHOG_HOST)
        WANDER_POSTHOG_PROJECT_TOKEN: $(WANDER_POSTHOG_PROJECT_TOKEN)
        WANDER_META_APP_ID: $(WANDER_META_APP_ID)
        WANDER_SNAPCHAT_CLIENT_ID: $(WANDER_SNAPCHAT_CLIENT_ID)
        WANDER_SUPABASE_PUBLISHABLE_KEY: $(WANDER_SUPABASE_PUBLISHABLE_KEY)
        WANDER_SUPABASE_URL: $(WANDER_SUPABASE_URL)
        TikTokClientKey: $(WANDER_TIKTOK_CLIENT_KEY)
        CFBundleDisplayName: rec.me
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.grayline.wander.profile
            CFBundleURLSchemes:
              - recme
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.grayline.wander.tiktok
            CFBundleURLSchemes:
              - $(WANDER_TIKTOK_CLIENT_KEY)
        LSApplicationQueriesSchemes:
          - instagram
          - instagram-stories
          - snapchat
          - tiktoksharesdk
          - snssdk1180
          - snssdk1233
        NSCameraUsageDescription: rec.me uses the camera only when you choose to take a photo in the app.
        NSCalendarsFullAccessUsageDescription: rec.me reads restaurant reservations from Apple Calendar to prepare private check-in reminders. It syncs only the matched restaurant and reservation time—not raw calendar titles, notes, guests, URLs, or addresses.
        NSContactsUsageDescription: rec.me uses contacts only to help you find people you already know. It never messages anyone.
        NSLocationWhenInUseUsageDescription: rec.me uses your location to suggest nearby places when you ask and to keep an optional nearby widget useful. It never broadcasts live location.
        NSPhotoLibraryAddUsageDescription: rec.me saves a share ticket to your photo library when you choose Save, Instagram Post, or TikTok.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_NAME: Wander
        PRODUCT_BUNDLE_IDENTIFIER: com.grayline.wander
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Wander/Resources/Wander.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          APS_ENVIRONMENT: development
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          APS_ENVIRONMENT: production
    dependencies:
      - package: posthog-ios
        product: PostHog
      - package: clerk-ios
        product: ClerkKit
      - package: clerk-ios
        product: ClerkKitUI
      - package: supabase-swift
        product: Supabase
      - package: tiktok-opensdk-ios
        product: TikTokOpenShareSDK
      - target: WanderWidgets
        embed: true
        link: false
      - target: WanderNearbyWidgets
        embed: true
        link: false
      - target: WanderShareExtension
        embed: true
        link: false
  WanderShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - WanderShareExtension
      - WanderImportShared
    info:
      path: WanderShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to rec.me
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
    settings:
      base:
        PRODUCT_NAME: WanderShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.grayline.wander.share
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WanderShareExtension/WanderShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  WanderWidgets:
    type: app-extension
    platform: iOS
    sources:
      - WanderWidgets
      - WanderControlShared
      - path: WanderWidgetShared
        excludes:
          - WanderNearbyWidgetSnapshot.swift
    info:
      path: WanderWidgets/Info.plist
      properties:
        CFBundleDisplayName: rec.me
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: WanderWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.grayline.wander.widgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WanderWidgets/WanderWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  WanderNearbyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - WanderNearbyWidgets
      - path: WanderWidgetShared
        excludes:
          - WanderCalendarWidgetSnapshot.swift
    info:
      path: WanderNearbyWidgets/Info.plist
      properties:
        CFBundleDisplayName: rec.me
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSWidgetWantsLocation: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: WanderNearbyWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.grayline.wander.nearbywidgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WanderNearbyWidgets/WanderNearbyWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  WanderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WanderTests
        excludes:
          - Fixtures/ios-fix/rec-354-followup-layout-pre.json
          - Fixtures/ios-fix/rec-354-followup-layout-pre.png
          - Fixtures/ios-fix/rec-354-single-screen-check-in-post.png
          - Fixtures/ios-fix/rec-354-single-screen-check-in-pre.json
          - Fixtures/ios-fix/rec-354-single-screen-check-in-pre.png
    dependencies:
      - target: Wander
    settings:
      base:
        PRODUCT_NAME: WanderTests
        PRODUCT_BUNDLE_IDENTIFIER: com.grayline.wander.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Wander.app/Wander"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
  WanderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WanderUITests
    dependencies:
      - target: Wander
    settings:
      base:
        PRODUCT_NAME: WanderUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.grayline.wander.uitests
        TEST_TARGET_NAME: Wander
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
