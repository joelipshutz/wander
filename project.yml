name: Wander
options:
  bundleIdPrefix: com.grayline
  settingPresets: none
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: Y7TVK75RZ8
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "125"
    WANDER_CLERK_FRONTEND_API: growing-pheasant-22.clerk.accounts.dev
    WANDER_SUPABASE_URL: https://rugmtlgufrhlxwfkumhw.supabase.co
packages:
  posthog-ios:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.59.3
  clerk-ios:
    url: https://github.com/clerk/clerk-ios
    from: 1.1.3
  supabase-swift:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.46.0
schemes:
  Wander:
    build:
      targets:
        Wander: all
        WanderShareExtension: all
        WanderWidgets: all
        WanderNearbyWidgets: all
        WanderTests: [test]
        WanderUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WanderTests
        - WanderUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  Wander:
    type: application
    platform: iOS
    sources:
      - Wander
      - WanderImportShared
      - WanderWidgetShared
      - WanderControlShared
    configFiles:
      Debug: Wander/Config/Auth.xcconfig
      Release: Wander/Config/Auth.xcconfig
    info:
      path: Wander/Resources/Info.plist
      properties:
        WANDER_CLERK_FRONTEND_API: $(WANDER_CLERK_FRONTEND_API)
        WANDER_CLERK_PUBLISHABLE_KEY: $(WANDER_CLERK_PUBLISHABLE_KEY)
        WANDER_POSTHOG_HOST: $(WANDER_POSTHOG_HOST)
        WANDER_POSTHOG_PROJECT_TOKEN: $(WANDER_POSTHOG_PROJECT_TOKEN)
        WANDER_SUPABASE_PUBLISHABLE_KEY: $(WANDER_SUPABASE_PUBLISHABLE_KEY)
        WANDER_SUPABASE_URL: $(WANDER_SUPABASE_URL)
        CFBundleDisplayName: rec.me
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.grayline.wander.profile
            CFBundleURLSchemes:
              - recme
        NSCameraUsageDescription: rec.me uses the camera only when you choose to take a photo in the app.
        NSContactsUsageDescription: rec.me uses contacts only to help you find people you already know. It never messages anyone.
        NSLocationWhenInUseUsageDescription: rec.me uses your location to suggest nearby places when you ask and to keep an optional nearby widget useful. It never broadcasts live location.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_NAME: Wander
        PRODUCT_BUNDLE_IDENTIFIER: com.grayline.wander
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Wander/Resources/Wander.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          APS_ENVIRONMENT: development
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          APS_ENVIRONMENT: production
    dependencies:
      - package: posthog-ios
        product: PostHog
      - package: clerk-ios
        product: ClerkKit
      - package: clerk-ios
        product: ClerkKitUI
      - package: supabase-swift
        product: Supabase
      - target: WanderWidgets
        embed: true
        link: false
      - target: WanderNearbyWidgets
        embed: true
        link: false
      - target: WanderShareExtension
        embed: true
        link: false
  WanderShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - WanderShareExtension
      - WanderImportShared
    info:
      path: WanderShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to rec.me
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 20
    settings:
      base:
        PRODUCT_NAME: WanderShareExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.grayline.wander.share
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WanderShareExtension/WanderShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  WanderWidgets:
    type: app-extension
    platform: iOS
    sources:
      - WanderWidgets
      - WanderControlShared
      - path: WanderWidgetShared
        excludes:
          - WanderNearbyWidgetSnapshot.swift
    info:
      path: WanderWidgets/Info.plist
      properties:
        CFBundleDisplayName: rec.me
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: WanderWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.grayline.wander.widgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WanderWidgets/WanderWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  WanderNearbyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - WanderNearbyWidgets
      - path: WanderWidgetShared
        excludes:
          - WanderCalendarWidgetSnapshot.swift
    info:
      path: WanderNearbyWidgets/Info.plist
      properties:
        CFBundleDisplayName: rec.me
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSWidgetWantsLocation: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: WanderNearbyWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.grayline.wander.nearbywidgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WanderNearbyWidgets/WanderNearbyWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  WanderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WanderTests
    dependencies:
      - target: Wander
    settings:
      base:
        PRODUCT_NAME: WanderTests
        PRODUCT_BUNDLE_IDENTIFIER: com.grayline.wander.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Wander.app/Wander"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
  WanderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WanderUITests
    dependencies:
      - target: Wander
    settings:
      base:
        PRODUCT_NAME: WanderUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.grayline.wander.uitests
        TEST_TARGET_NAME: Wander
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
