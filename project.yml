name: Wander
options:
  bundleIdPrefix: com.grayline
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: Y7TVK75RZ8
    WANDER_CLERK_FRONTEND_API: growing-pheasant-22.clerk.accounts.dev
    WANDER_SUPABASE_URL: https://rugmtlgufrhlxwfkumhw.supabase.co
packages:
  posthog-ios:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.59.3
  clerk-ios:
    url: https://github.com/clerk/clerk-ios
    from: 1.1.3
  supabase-swift:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.46.0
schemes:
  Wander:
    build:
      targets:
        Wander: all
        WanderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WanderTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  Wander:
    type: application
    platform: iOS
    sources:
      - Wander
    configFiles:
      Debug: Wander/Config/Auth.xcconfig
      Release: Wander/Config/Auth.xcconfig
    info:
      path: Wander/Resources/Info.plist
      properties:
        WANDER_CLERK_FRONTEND_API: $(WANDER_CLERK_FRONTEND_API)
        WANDER_CLERK_PUBLISHABLE_KEY: $(WANDER_CLERK_PUBLISHABLE_KEY)
        WANDER_POSTHOG_HOST: $(WANDER_POSTHOG_HOST)
        WANDER_POSTHOG_PROJECT_TOKEN: $(WANDER_POSTHOG_PROJECT_TOKEN)
        WANDER_SUPABASE_PUBLISHABLE_KEY: $(WANDER_SUPABASE_PUBLISHABLE_KEY)
        WANDER_SUPABASE_URL: $(WANDER_SUPABASE_URL)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Wander uses the camera only when you choose to take a photo in the app.
        NSLocationWhenInUseUsageDescription: Wander uses your location once to suggest nearby places. It never broadcasts live location.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_NAME: Wander
        PRODUCT_BUNDLE_IDENTIFIER: com.grayline.wander
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "58"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Wander/Resources/Wander.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          APS_ENVIRONMENT: development
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          APS_ENVIRONMENT: production
    dependencies:
      - package: posthog-ios
        product: PostHog
      - package: clerk-ios
        product: ClerkKit
      - package: clerk-ios
        product: ClerkKitUI
      - package: supabase-swift
        product: Supabase
  WanderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WanderTests
    dependencies:
      - target: Wander
    settings:
      base:
        PRODUCT_NAME: WanderTests
        PRODUCT_BUNDLE_IDENTIFIER: com.grayline.wander.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Wander.app/Wander"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
