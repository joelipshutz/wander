<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astir · Profiles & Lists design preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dedbd4;color:#141714;font-family:'Avenir Next',sans-serif;padding:36px}header{max-width:810px;margin:0 auto 26px}header h1{font:600 29px Georgia,serif;margin:0 0 8px}header p{font-size:15px;line-height:1.5;margin:0;color:#655f57}.board{display:grid;grid-template-columns:393px 393px;gap:28px 24px;justify-content:center}.caption{font-weight:600;margin:0 0 10px;font-size:14px}.phone{--paper:#f2e9db;--ink:#141714;--muted:#655f57;--raised:#fbf6ed;--line:#14171426;--action:#1417140e;--accent:#b23620;background:var(--paper);color:var(--ink);width:393px;height:852px;overflow:hidden;position:relative;border-radius:36px;box-shadow:0 4px 18px #14171415}.dark{--paper:#141714;--ink:#f2e9db;--muted:#98958d;--raised:#1b1f1b;--line:#f2e9db26;--action:#f2e9db1a;--accent:#f05a3c}.status{height:59px;display:flex;align-items:center;justify-content:space-between;padding:8px 29px 0;font:600 16px -apple-system,sans-serif}.status-right{display:flex;align-items:center;gap:6px}.island{position:absolute;top:11px;left:135px;width:123px;height:33px;background:#050605;border-radius:22px}.battery{width:24px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative}.battery:before{content:'';position:absolute;inset:2px;background:currentColor;border-radius:1px}.battery:after{content:'';position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:1px}.nav{height:60px;padding:4px 16px 12px;display:flex;gap:8px;align-items:center}.spacer{flex:1}.icon{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.nav button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--raised);color:var(--ink);border:1px solid #ffffff28;box-shadow:0 2px 6px #00000009}.badge{position:absolute;right:3px;top:2px;background:#f05a3c;color:#141714;font:700 10px 'Avenir Next',sans-serif;min-width:15px;height:15px;border-radius:9px;display:grid;place-items:center}.bell{position:relative}.main{padding:0 16px}.hero{display:flex;gap:20px;align-items:start;margin-top:6px}.avatar{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font:500 31px Georgia,serif;background:#d6cec0;color:#393d34;flex:none;border:1px solid #1417140d}.dark .avatar{background:#3b4037;color:#ece5d9}.identity{flex:1;padding-top:3px}.identity h2{font:600 22px Georgia,serif;margin:0 0 17px}.counts{display:flex;justify-content:space-between;text-align:center}.count strong{display:block;font-size:18px;line-height:1.25}.count span{font-size:12px;color:var(--muted)}.bio{margin-top:12px;font-size:15px;line-height:1.55}.bio .since{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;min-height:44px;border:0;background:var(--action);color:var(--ink);font:600 15px 'Avenir Next',sans-serif;padding:8px 12px;border-radius:12px}.streak{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);height:61px;margin-top:24px;font-size:15px;font-weight:600}.streak .icon{color:var(--accent);width:20px}.days{display:flex;gap:3px}.days i{width:10px;height:4px;border-radius:3px;background:var(--accent)}.days i:last-child{background:var(--line)}.streak small{font-size:12px;color:var(--muted)}h3{font:600 21px Georgia,serif;margin:24px 0 12px}.filters{display:flex;gap:23px;font-size:15px;border-bottom:1px solid var(--line);height:39px}.filters span{color:var(--muted)}.filters .selected{color:var(--ink);font-weight:600;border-bottom:2px solid var(--ink)}.filters small{font-size:12px;padding-left:3px}.activity{margin-top:12px;border:1px solid var(--line);background:var(--raised);border-radius:20px;overflow:hidden}.place{display:flex;align-items:center;gap:12px;padding:14px 12px}.place+.place{border-top:1px solid var(--line)}.symbol{width:42px;height:42px;background:var(--paper);border:2px solid #42cce2;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none}.place strong{display:block;font-size:16px;font-weight:600;line-height:1.4}.place small{display:block;color:var(--muted);font-size:12px;line-height:1.6}.chev{width:14px;height:14px;margin-left:auto;color:var(--muted)}.all-activity{text-align:center;color:var(--accent);padding:11px;border-top:1px solid var(--line);font-size:13px;font-weight:600}.list-title{font:600 34px/1.08 Georgia,serif;margin:10px 0 10px;letter-spacing:-.6px}.description{font-size:16px;line-height:1.5;color:var(--muted);margin:0 0 15px}.owner{display:flex;align-items:center;gap:8px;font-size:13px}.mini-avatar{height:30px;width:30px;border-radius:50%;background:#d6cec0;color:#393d34;display:grid;place-items:center;font-size:11px;font-weight:700}.owner strong{font-weight:600}.owner span{color:var(--muted);font-size:12px}.owner .place-count{color:var(--accent);margin-left:auto;font-weight:600}.collaborate{height:28px;width:28px;border:1px solid #f05a3c57;background:#f05a3c1f;color:var(--accent);border-radius:10px;display:grid;place-items:center}.collaborate .icon{width:14px;height:14px}.list .actions{margin-top:16px}.map{border-radius:22px;border:1px solid var(--line);overflow:hidden;margin-top:16px;background:var(--raised)}.map img{display:block;width:100%;height:168px;object-fit:cover;object-position:center 52%}.dark .map img{filter:brightness(.67) saturate(.7)}.map-foot{padding:14px;display:flex;gap:8px;align-items:center;font-size:15px;font-weight:600}.map-foot span{margin-left:auto;font-size:13px;font-weight:400;color:var(--muted)}.list h3{margin:20px 0 12px}.list .place{margin-bottom:10px;background:var(--raised);border:1px solid var(--line);border-radius:20px}.list .place small{font-size:12px}.tabbar{position:absolute;bottom:18px;left:16px;right:16px;display:flex;align-items:center;background:var(--raised);border:1px solid #ffffff18;border-radius:34px;padding:6px;box-shadow:0 4px 22px #0000000a;height:66px}.tab{flex:1;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:3px;height:53px;font-size:10px;font-weight:600;border-radius:27px}.tab .icon{height:24px;width:24px;stroke-width:2.3}.tab.active{background:var(--action);color:var(--accent)}.homebar{width:128px;height:5px;border-radius:3px;background:var(--ink);position:absolute;bottom:6px;left:132px}.profile-map{margin-top:15px}.profile-map img{height:190px}.fade{height:56px;position:absolute;bottom:0;left:0;right:0;background:var(--paper)}.phone button{cursor:default}@media(max-width:850px){body{padding:20px 12px}.board{grid-template-columns:393px;gap:26px}header{max-width:393px}}
.common{display:flex;align-items:center;gap:12px;min-height:72px;margin-top:24px;padding:12px 16px;border-bottom:1px solid var(--line)}.avatar-pair{display:flex;align-items:center;flex:none;width:54px}.avatar-pair .mini-avatar{width:32px;height:32px;border:2px solid var(--paper);flex:none}.avatar-pair .mini-avatar:first-child{z-index:1}.avatar-pair .mini-avatar:last-child{margin-left:-10px;background:#c8d0c3}.common strong{display:block;font-size:16px;font-weight:600;line-height:1.4}.common small{display:block;font-size:12px;color:var(--muted);line-height:1.6}
</style>
<header><h1>Profiles & Lists</h1><p>One shared action row. Design mockups with sample content; native build and interaction testing follow approval.</p></header>
<main class="board" id="board"></main>
<script>
const paths={menu:'M4 6h16M4 12h16M4 18h16',back:'m14 5-7 7 7 7',plus:'M12 4v16M4 12h16',bell:'M6 8a6 6 0 0 1 12 0c0 8 3 7 3 9H3c0-2 3-1 3-9M10 21h4',bug:'M8 8h8a3 3 0 0 1 3 3v4a7 7 0 0 1-14 0v-4a3 3 0 0 1 3-3ZM9 8V6a3 3 0 0 1 6 0v2M12 8v13M2 12h3M19 12h3M2 18l3-1M19 17l3 1M5 6l2 3M19 6l-2 3',map:'m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2ZM9 3v16M15 5v16',feed:'M5 3h14v18H5ZM8 7h8M8 11h8M8 15h3M14 15h2M8 18h8',lists:'M7 4h14v17H7ZM3 7h1M3 12h1M3 17h1M11 8h6M11 12h6M11 16h6',person:'M8 7a4 4 0 1 0 8 0 4 4 0 0 0-8 0M4 21v-2a8 8 0 0 1 16 0v2Z',chevron:'m9 5 7 7-7 7',flame:'M12 2c1 6 6 6 6 12a6 6 0 1 1-12 0c0-3 2-5 3-7 0 4 2 4 3 5 2-3 1-6 0-10Z',wifi:'M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M9 16a5 5 0 0 1 6 0M12 20h0',signal:'M3 18v2M8 13v7M13 8v12M18 3v17'};
paths.more='M5 12h.01M12 12h.01M19 12h.01';
function icon(name,cls=''){return `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]}"></path></svg>`}
function button(name,label){return `<button aria-label="${label}">${icon(name)}</button>`}
const mapPath='../../Wander/Resources/Assets.xcassets/OnboardingMapDiary.imageset/OnboardingMapDiary.jpg';
function mapCard(profile=false){return `<div class="map ${profile?'profile-map':''}"><img src="${mapPath}" alt="Sample saved places on the map"><div class="map-foot">${icon('map')}${profile?'Your map':'View map'}<span>${profile?'42':'6'} places</span>${icon('chevron','chev')}</div></div>`}
function place(emoji,name,detail){return `<div class="place"><div class="symbol">${emoji}</div><div><strong>${name}</strong><small>${detail}</small></div>${icon('chevron','chev')}</div>`}
function profile(){return `<div class="nav">${button('bug','Feedback')}<div class="spacer"></div><div class="bell">${button('bell','Notifications')}<b class="badge">2</b></div>${button('menu','Settings')}</div><div class="main"><div class="hero"><div class="avatar">AM</div><div class="identity"><h2>Alex Morgan</h2><div class="counts"><div class="count"><strong>128</strong><span>Followers</span></div><div class="count"><strong>94</strong><span>Following</span></div><div class="count"><strong>36</strong><span>Friends</span></div></div></div></div><div class="bio"><div>@alexmorgan</div><div>Los Angeles, CA</div><div>Good coffee. Long walks. Places worth keeping.</div><div class="since">Member since September 2026</div></div><div class="actions"><button>Edit profile</button><button>Share profile</button></div><div class="streak">${icon('flame')}<span>5 day streak</span><div class="spacer"></div><div class="days">${'<i></i>'.repeat(7)}</div><small>8 best</small></div><h3>Activity</h3><div class="filters"><span class="selected">All</span><span>Check-ins <small>24</small></span><span>Wanna <small>18</small></span></div><div class="activity">${place('☕','Woodcat Coffee','Check-in · Today, 9:12 AM')}${place('🌳','Silver Lake Meadow','Check-in · Yesterday, 4:30 PM')}<div class="all-activity">View all activity</div></div>${mapCard(true)}</div>`}
function list(){return `<div class="nav">${button('back','Back')}<div class="spacer"></div>${button('plus','Add places to list')}</div><div class="main"><h2 class="list-title">Weekend favorites</h2><p class="description">Coffee, long lunches, and a little fresh air.</p><div class="owner"><div class="mini-avatar">AM</div><strong>You</strong><span>solo list</span><div class="collaborate">${icon('plus')}</div><span class="place-count">6 places</span></div><div class="actions"><button>Edit list</button><button>Share list</button></div>${mapCard()}<h3>Places</h3>${place('☕','Woodcat Coffee','Coffee shop · Silver Lake')}${place('🌳','Silver Lake Meadow','Park · Silver Lake')}${place('🍽️','Botanica','Restaurant · Silver Lake')}</div>`}
function tabs(active){return `<div class="fade"></div><div class="tabbar">${[['map','Map'],['feed','Feed'],['lists','Lists'],['person','Profile']].map(([i,t])=>`<div class="tab ${t===active?'active':''}">${icon(i)}${t}</div>`).join('')}</div><div class="homebar"></div>`}
function member(){return `<div class="nav">${button('back','Back')}<div class="spacer"></div>${button('more','More profile actions')}</div><div class="main"><div class="hero"><div class="avatar">JP</div><div class="identity"><h2>Jamie Park</h2><div class="counts"><div class="count"><strong>248</strong><span>Followers</span></div><div class="count"><strong>180</strong><span>Following</span></div><div class="count"><strong>64</strong><span>Friends</span></div></div></div></div><div class="bio"><div>@jamiepark</div><div>Los Angeles, CA</div><div>Coastal walks, tiny cafés, and good company.</div><div class="since">Member since September 2026</div></div><div class="actions"><button>Following</button><button>Share profile</button></div><div class="common"><div class="avatar-pair"><div class="mini-avatar">AM</div><div class="mini-avatar">JP</div></div><div><strong>8 places in common</strong><small>See where your maps overlap</small></div>${icon('chevron','chev')}</div><h3>Activity</h3><div class="filters"><span class="selected">All</span><span>Check-ins <small>32</small></span><span>Wanna <small>14</small></span></div><div class="activity">${place('☕','Woodcat Coffee','Check-in · Today, 10:24 AM')}${place('🌳','Silver Lake Meadow','Check-in · Yesterday, 5:15 PM')}<div class="all-activity">View all activity</div></div>${mapCard(true).replace('Your map',"Jamie's map").replace('42 places','46 places')}</div>`}
for(const theme of ['light','dark'])for(const screen of ['profile','list']){const cell=document.createElement('section');cell.innerHTML=`<div class="caption">${screen==='profile'?'Profile':'List detail'} · ${theme==='light'?'Light':'Dark'}</div><div id="${screen}-${theme}" class="phone ${theme} ${screen}"><div class="island"></div><div class="status"><span>9:41</span><div class="status-right">${icon('signal')}${icon('wifi')}<div class="battery"></div></div></div>${screen==='profile'?profile():list()}${tabs(screen==='profile'?'Profile':'Lists')}</div>`;document.getElementById('board').append(cell)}
for(const theme of ['light','dark']){const cell=document.createElement('section');cell.innerHTML=`<div class="caption">Member profile · ${theme==='light'?'Light':'Dark'}</div><div id="member-${theme}" class="phone ${theme} member"><div class="island"></div><div class="status"><span>9:41</span><div class="status-right">${icon('signal')}${icon('wifi')}<div class="battery"></div></div></div>${member()}${tabs('Feed')}</div>`;document.getElementById('board').append(cell)}
</script>
</html>
