name: AstirLiveReview
options:
  bundleIdPrefix: com.grayline
  settingPresets: none
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    PRODUCT_NAME: $(TARGET_NAME)
    ONLY_ACTIVE_ARCH: YES
    COPY_PHASE_STRIP: NO
    SWIFT_OPTIMIZATION_LEVEL: -Onone
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: Astir Review
targets:
  AstirLiveReview:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grayline.astirlivereview
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: '0.1'
    scheme:
      gatherCoverageData: false
      testTargets:
        - AstirLiveReviewUITests
  AstirLiveReviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Checks/UITests]
    dependencies:
      - target: AstirLiveReview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grayline.astirlivereview.uitests
        TEST_TARGET_NAME: AstirLiveReview
        SWIFT_VERSION: '6.0'
