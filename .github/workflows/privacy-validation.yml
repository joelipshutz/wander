name: REC-636 canonical Replay window validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-window-validation:
    name: Verify original Replay methods with isolated fixture windows
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Admit canonical carrier, toolchain and existing simulator
        run: |
          set -euo pipefail
          export DIAG="$RUNNER_TEMP/rec636-v44-canonical-replay-window-isolation"
          printf 'DIAG=%s\n' "$DIAG" >> "$GITHUB_ENV"
          mkdir "$DIAG"
          python3 - <<'PYCODE'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path.cwd().resolve();out=Path(os.environ['DIAG'])
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['GITHUB_SHA'], 'carrier_checkout_mismatch'
          proofpath=root/'scripts/diagnostics/window-isolation-source-proof.json'
          assert hashlib.sha256(proofpath.read_bytes()).hexdigest()=='1cfb01a36880773d1ea0bd982980cf8867e343a75202ba58c8d21bf77d6a3556', 'canonical_proof_changed'
          proof=json.loads(proofpath.read_text());base=proof['baseHead']
          assert base=='22e7c6d9efd4ac0957ed25cd60e8cc26a05bc7f7', 'canonical_base_changed'
          allowed={'WanderTests/ReplayMaskingTests.swift','.github/workflows/privacy-validation.yml','scripts/diagnostics/run-replay-window-validation.py','scripts/diagnostics/window-isolation-source-proof.json','scripts/diagnostics/README.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines())
          assert changed==allowed, 'canonical_carrier_delta_changed'
          original=subprocess.check_output(['git','cat-file','blob',base+':WanderTests/ReplayMaskingTests.swift'])
          actual=subprocess.check_output(['git','cat-file','blob',head+':WanderTests/ReplayMaskingTests.swift'])
          assert hashlib.sha256(original).hexdigest()=='e20df909d2100f01ff761b5e356b1e2ae51d1e51a1843ed0c44ca59f661b9681', 'canonical_replay_base_changed'
          assert hashlib.sha256(actual).hexdigest()=='9cdf8c12152c82689920ecb315bd366fd2870d0da9b17b87c1f2ab812666a439', 'tracked_window_trial_changed'
          maps=proof['sourceMaps'];assert [len(maps[k]) for k in ['swift','buildInputs','tooling']]==[448,150,2]
          tracked=set(subprocess.check_output(['git','ls-files','*.swift'],text=True).splitlines())
          assert tracked==set(maps['swift']), 'canonical_swift_roster_changed'
          for group in maps.values():
              for relative,expected in group.items():
                  path=root/relative
                  assert path.is_file() and not path.is_symlink() and hashlib.sha256(path.read_bytes()).hexdigest()==expected, 'canonical_carrier_input_changed'
          xcode=subprocess.check_output(['xcodebuild','-version'],text=True).strip()
          assert xcode=='Xcode 26.6\nBuild version 17F113', 'canonical_trial_toolchain_changed'
          runtimes=json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','--json'],text=True))['runtimes']
          admitted=[r for r in runtimes if r.get('isAvailable') and r['identifier']=='com.apple.CoreSimulator.SimRuntime.iOS-26-5']
          assert len(admitted)==1 and admitted[0]['buildversion']=='23F77', 'canonical_trial_runtime_changed'
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          choices=[d for runtime,rows in devices.items() if runtime=='com.apple.CoreSimulator.SimRuntime.iOS-26-5' for d in rows if d['name']=='iPhone 17 Pro' and d.get('isAvailable')]
          assert len(choices)==1, 'unique_existing_canonical_trial_device_required'
          device=choices[0]
          (out/'device-id.txt').write_text(device['udid']+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('DEVICE_ID='+device['udid']+'\n')
          record={'dispatchSHA':head,'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'xcode':xcode,'deviceID':device['udid'],'deviceModel':'iPhone 17 Pro','runtime':'iOS26.5','runtimeBuild':'23F77','retries':0,'diagnosticOnly':True,'releaseAcceptance':False,'priorFullUnitSequenceReproduced':False,'canonicalBase':base,'sourceProofSHA256':hashlib.sha256(proofpath.read_bytes()).hexdigest(),'allowedChangedPaths':sorted(allowed),'sourceInputCounts':[448,150,2]}
          (out/'admission.json').write_text(json.dumps(record,indent=2)+'\n')
          PYCODE
          DEVICE_ID="$(cat "$DIAG/device-id.txt")"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance dark
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl shutdown "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_ID"
          xcrun simctl ui "$DEVICE_ID" appearance
      - name: Check fixed fictional inventory format before building
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,json,os,runpy,signal,time
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE']).resolve();out=Path(os.environ['DIAG']).resolve()
          assert os.environ.get('GITHUB_ACTIONS')=='true' and Path.cwd().resolve()==root
          assert out.is_dir() and out.is_relative_to(Path(os.environ['RUNNER_TEMP']).resolve())
          script=root/'scripts/diagnostics/run-replay-window-validation.py'
          expected='c39d6c7bde20aeafa377a8638d232e878cd2c9e13d2eb40ffd1b8e9addfb3482'
          assert script.is_file() and not script.is_symlink() and hashlib.sha256(script.read_bytes()).hexdigest()==expected, 'canonical_parser_reader_changed'
          started=time.monotonic();module=runpy.run_path(str(script),run_name='rec636_canonical_inventory_preflight')
          globals_=module['command'].__globals__
          assert module['parse_listapps'].__globals__ is globals_ and globals_['ROOT']==root and globals_['OUT'] is None
          globals_['OVERALL_DEADLINE']=started+30
          fixture=b'{ "com.example.rec636-parser-fixture" = { CFBundleIdentifier = "com.example.rec636-parser-fixture"; ApplicationType = User; }; }'
          expected_rows={'com.example.rec636-parser-fixture':{'CFBundleIdentifier':'com.example.rec636-parser-fixture','ApplicationType':'User'}}
          assert not (out/'inventory-format-preflight.json').exists(), 'canonical_parser_no_retry'
          receipt={'state':'started','fictionalFixtureOnly':True,'diagnosticOnly':True,'releaseAcceptance':False,'runnerSHA256':expected,'overallDeadlineSeconds':30,'retries':0,'simulatorInventoryQueried':False,'resetCalled':False,'nativeTestExecuted':False,'rawInventoryPersisted':False}
          def interrupted(_signal,_frame):raise InterruptedError('canonical_parser_preflight_interrupted')
          previous=signal.signal(signal.SIGTERM,interrupted)
          try:
              assert module['parse_listapps'](fixture,out,'inventory-format-preflight-fictional')==expected_rows
              assert time.monotonic()<=globals_['OVERALL_DEADLINE'] and hashlib.sha256(script.read_bytes()).hexdigest()==expected
              receipt.update(state='Passed',fixedDictionaryValidated=True)
          except BaseException as error:
              receipt.update(state='Failed',category=type(error).__name__)
              raise
          finally:
              signal.signal(signal.SIGTERM,previous)
              receipt['elapsedSeconds']=time.monotonic()-started
              module['save'](out/'inventory-format-preflight.json',receipt)
          PYCODE
      - name: Resolve only pinned canonical packages in the job-owned cache
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project Wander.xcodeproj -scheme Wander \
            -clonedSourcePackagesDirPath "$DIAG/SourcePackages" -onlyUsePackageVersionsFromResolvedFile
      - name: Verify canonical SDK and tracked trial source before one build
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE']);out=Path(os.environ['DIAG']);sdk=out/'SourcePackages/checkouts/posthog-ios'
          proofpath=root/'scripts/diagnostics/window-isolation-source-proof.json';proof=json.loads(proofpath.read_text())
          assert hashlib.sha256(proofpath.read_bytes()).hexdigest()=='1cfb01a36880773d1ea0bd982980cf8867e343a75202ba58c8d21bf77d6a3556'
          assert subprocess.check_output(['git','-C',str(sdk),'rev-parse','HEAD'],text=True).strip()==proof['SDKRevision']
          assert subprocess.check_output(['git','-C',str(sdk),'status','--porcelain'])==b'', 'canonical_SDK_not_clean'
          rows=[]
          for row in proof['files']:
              path=(sdk if row['role']=='sdk' else root)/row['path'];actual=hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual==row['proposedSHA256'], 'canonical_trial_source_changed'
              if row['role']!='test':assert row['originalSHA256']==row['proposedSHA256']
              rows.append({'role':row['role'],'path':row['path'],'sha256':actual})
          (out/'canonical-source-fingerprints.json').write_text(json.dumps({'SDKRevision':proof['SDKRevision'],'SDKClean':True,'runtimePatchApplied':False,'files':rows,'sourceMaps':proof['sourceMaps'],'sourceProofSHA256':hashlib.sha256(proofpath.read_bytes()).hexdigest()},indent=2)+'\n')
          PYCODE
      - name: Build canonical parent test products once
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -quiet -project Wander.xcodeproj -scheme Wander \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$DIAG/DerivedData" -clonedSourcePackagesDirPath "$DIAG/SourcePackages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -jobs 2 \
            -testProductsPath "$DIAG/Parent.xctestproducts" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES
          python3 - <<'PYCODE'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE']);out=Path(os.environ['DIAG']);sdk=out/'SourcePackages/checkouts/posthog-ios'
          proofpath=root/'scripts/diagnostics/window-isolation-source-proof.json';proof=json.loads(proofpath.read_text())
          assert subprocess.check_output(['git','-C',str(sdk),'rev-parse','HEAD'],text=True).strip()==proof['SDKRevision']
          assert subprocess.check_output(['git','-C',str(sdk),'status','--porcelain'])==b''
          for row in proof['files']:
              path=(sdk if row['role']=='sdk' else root)/row['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==row['proposedSHA256']
          for group in proof['sourceMaps'].values():
              for relative,expected in group.items():assert hashlib.sha256((root/relative).read_bytes()).hexdigest()==expected
          products=out/'Parent.xctestproducts';assert (products/'Info.plist').is_file()
          files={str(p.relative_to(products)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(products.rglob('*')) if p.is_file() and not p.is_symlink()}
          record={'sourceHashesStillMatch':True,'productFiles':files,'SDKRevision':proof['SDKRevision'],'SDKClean':True,'sourceProofSHA256':hashlib.sha256(proofpath.read_bytes()).hexdigest(),'sourceMaps':proof['sourceMaps']}
          (out/'diagnostic-build-fingerprints.json').write_text(json.dumps(record,indent=2)+'\n')
          PYCODE
      - name: Run each original Replay method once in a fresh test process
        run: |
          set -euo pipefail
          python3 scripts/diagnostics/run-replay-window-validation.py \
            --out "$DIAG" --products "$DIAG/Parent.xctestproducts" --device "$DEVICE_ID"
      - name: Retain final canonical source identities
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE']);out=Path(os.environ['DIAG']);out.mkdir(exist_ok=True)
          proofpath=root/'scripts/diagnostics/window-isolation-source-proof.json';proof=json.loads(proofpath.read_text());sdk=out/'SourcePackages/checkouts/posthog-ios'
          rows=[]
          for row in proof['files']:
              p=(sdk if row['role']=='sdk' else root)/row['path']
              rows.append({'role':row['role'],'path':row['path'],'exists':p.is_file(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None})
          ready=sdk.is_dir();sdkhead=subprocess.check_output(['git','-C',str(sdk),'rev-parse','HEAD'],text=True).strip() if ready else None
          clean=subprocess.check_output(['git','-C',str(sdk),'status','--porcelain'])==b'' if ready else None
          (out/'final-source-fingerprints.json').write_text(json.dumps({'files':rows,'SDKRevision':sdkhead,'SDKClean':clean,'diagnosticOnly':True,'releaseAcceptance':False},indent=2)+'\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rec636-v44-canonical-replay-window-isolation
          path: |
            ${{ runner.temp }}/rec636-v44-canonical-replay-window-isolation/*.json
            ${{ runner.temp }}/rec636-v44-canonical-replay-window-isolation/private
            ${{ runner.temp }}/rec636-v44-canonical-replay-window-isolation/credentials
            ${{ runner.temp }}/rec636-v44-canonical-replay-window-isolation/source-before
            ${{ runner.temp }}/rec636-v44-canonical-replay-window-isolation/source-after
            ${{ runner.temp }}/rec636-v44-canonical-replay-window-isolation/private-source-before
            ${{ runner.temp }}/rec636-v44-canonical-replay-window-isolation/private-source-after
            ${{ runner.temp }}/rec636-v44-canonical-replay-window-isolation/credentials-source-before
            ${{ runner.temp }}/rec636-v44-canonical-replay-window-isolation/credentials-source-after
          if-no-files-found: warn
          retention-days: 7
