name: Contact discovery validation
on:
  pull_request:
    branches: [main]
    paths:
      - '**/*ContactDiscovery*'
      - '**/PeopleFollowButton.swift'
      - 'supabase/migrations/*ranked_people_recommendations.sql'
      - 'supabase/tests/ranked_people_recommendations.sql'
      - '**/ContactProvider.swift'
      - '**/OnboardingFriendSuggestions*'
      - 'supabase/functions/contact-discovery/**'
      - 'supabase/functions/clerk-profile-webhook/**'
      - 'supabase/migrations/*contact_discovery.sql'
      - 'supabase/tests/contact_discovery.sql'
      - 'supabase/functions/_shared/contact-identifiers.ts'
      - '.github/workflows/contact-discovery-validation.yml'
      - 'WanderTests/ReplayMaskingTests.swift'
      - 'WanderTests/ReplayFixtureHostAdmission.swift'
      - 'WanderTests/FeedScreenScrollingPerformanceTests.swift'
      - 'WanderTests/PostHogReplayPerformanceTests.swift'
      - 'scripts/run-parent-regression.py'
      - 'scripts/test_import_performance_routing.py'
      - 'WanderTests/ImportAutoSaveFileResponsivenessTests.swift'
      - 'WanderTests/ImportAutoSavePerformanceTests.swift'
      - 'WanderTests/ImportAutoSaveWithoutListPerformanceTests.swift'
      - 'scripts/test_parent_regression.py'
      - 'scripts/record-replay-compiler-flags.py'
      - 'scripts/test_record_replay_compiler_flags.py'
      - 'scripts/test_replay_isolation_workflows.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contact-discovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno test supabase/functions/contact-discovery/handler.test.ts
      - run: deno check --config supabase/functions/clerk-profile-webhook/deno.json supabase/functions/clerk-profile-webhook/index.ts
  native:
    runs-on: macos-26
    # Full units, three required import stress runs and four fresh-host Replay
    # cases share this job. Match Privacy's budget; per-test limits are unchanged.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Select existing iPhone simulator
        run: |
          xcrun simctl list devices available --json > /tmp/devices.json
          python3 - <<'PY'
          import json, os
          devices = json.load(open('/tmp/devices.json'))['devices']
          choices = [(runtime, d) for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if d['name'] == 'iPhone 17 Pro']
          if not choices:
              choices = [(runtime, d) for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if d['name'].startswith('iPhone')]
          assert choices, 'No existing iPhone simulator'
          chosen = sorted(choices, key=lambda x: x[0])[-1][1]
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('TEST_DEVICE_ID=' + chosen['udid'] + '\n')
          print('Testing on', chosen['name'])
          PY
      - name: Initialize simulator for native capture
        run: |
          xcrun simctl bootstatus "$TEST_DEVICE_ID" -b
          open -a Simulator --args -CurrentDeviceUDID "$TEST_DEVICE_ID"
      # Full-size search and cache contracts run here; unchanged wall-clock
      # budgets run separately on the controlled reference simulator. Replay
      # installs process-wide observers and must use a fresh test host.
      - name: Unit suite and contact-discovery UI flows
        run: >-
          xcodebuild test -quiet -project Wander.xcodeproj -scheme Wander
          -destination "platform=iOS Simulator,id=$TEST_DEVICE_ID"
          -derivedDataPath "$RUNNER_TEMP/DerivedData" -jobs 2 -parallel-testing-enabled NO
          -only-testing:WanderTests -only-testing:WanderUITests/ContactDiscoveryUITests
          -only-testing:WanderUITests/CompactPeopleCardsUITests
          -skip-testing:WanderTests/TrustedPlaceSearchTests/testSearchOneThousandMemoriesP95UnderFiftyMilliseconds
          -skip-testing:WanderTests/WanderPlaceCategoryTests/testPerformanceFixtureExercisesARealisticHighDataAccountWithinBudget
          -skip-testing:WanderTests/ImportAutoSaveFileResponsivenessTests/testPerformanceFileAutoSaveWith1500ResolvedRowsAndList
          -skip-testing:WanderTests/ImportAutoSavePerformanceTests/testPerformanceGoogleWannaAutoSaveWith1500ResolvedRows
          -skip-testing:WanderTests/ImportAutoSaveWithoutListPerformanceTests/testPerformanceGoogleWannaAutoSaveWithoutListWith1500ResolvedRows
          -skip-testing:WanderTests/ReplayMaskingTests
          -skip-testing:WanderTests/FeedScreenScrollingPerformanceTests/testPerformanceMountedFeedScrollWith600EventsAndActualReplay
          -skip-testing:WanderTests/PostHogReplayPerformanceTests/testPerformanceActualReplayMaskedScroll
          -resultBundlePath "$RUNNER_TEMP/ContactDiscovery.xcresult"
          CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES
      # Required three-sample stress workloads; ordinary test deadlines stay unchanged.
      - name: Required 1500-row file import performance
        if: ${{ success() || failure() }}
        run: |
          python3 -B -m unittest discover -s scripts -p test_import_performance_routing.py
          python3 scripts/run-parent-regression.py --suite import-file-performance \
            --destination "$TEST_DEVICE_ID" --derived-data "$RUNNER_TEMP/DerivedData" \
            --result-bundle "$RUNNER_TEMP/ImportFilePerformance.xcresult" \
            --selection-file "$RUNNER_TEMP/import-file-performance-selection.json"
      - name: Required 1500-row automatic import performance
        if: ${{ success() || failure() }}
        run: |
          python3 -B -m unittest discover -s scripts -p test_import_performance_routing.py
          python3 scripts/run-parent-regression.py --suite import-autosave-performance \
            --destination "$TEST_DEVICE_ID" --derived-data "$RUNNER_TEMP/DerivedData" \
            --result-bundle "$RUNNER_TEMP/ImportAutoSavePerformance.xcresult" \
            --selection-file "$RUNNER_TEMP/import-autosave-performance-selection.json"
      - name: Required 1500-row automatic import without list performance
        if: ${{ success() || failure() }}
        run: |
          python3 -B -m unittest discover -s scripts -p test_import_performance_routing.py
          python3 scripts/run-parent-regression.py --suite import-autosave-no-list-performance \
            --destination "$TEST_DEVICE_ID" --derived-data "$RUNNER_TEMP/DerivedData" \
            --result-bundle "$RUNNER_TEMP/ImportAutoSaveWithoutListPerformance.xcresult" \
            --selection-file "$RUNNER_TEMP/import-autosave-no-list-performance-selection.json"
      - name: Prepare isolated Replay test products once
        id: replay-products
        if: ${{ success() || failure() }}
        # Use production-style C size optimization while keeping Swift Debug and C DEBUG assertions.
        run: |
          test ! -e "$RUNNER_TEMP/ReplayDerivedData"
          test ! -L "$RUNNER_TEMP/ReplayDerivedData"
          python3 -m unittest discover -s scripts -p test_record_replay_compiler_flags.py
          python3 -B -m unittest discover -s scripts -p test_replay_isolation_workflows.py
          xcodebuild build-for-testing -quiet -project Wander.xcodeproj -scheme Wander -configuration Debug \
            -destination "platform=iOS Simulator,id=$TEST_DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/ReplayDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/DerivedData/SourcePackages" -jobs 2 -parallel-testing-enabled NO \
            -testProductsPath "$RUNNER_TEMP/Replay.xctestproducts" \
            -only-testing:WanderTests/ReplayMaskingTests \
            -only-testing:WanderTests/FeedScreenScrollingPerformanceTests/testPerformanceMountedFeedScrollWith600EventsAndActualReplay \
            -only-testing:WanderTests/PostHogReplayPerformanceTests/testPerformanceActualReplayMaskedScroll \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES \
            GCC_OPTIMIZATION_LEVEL=s SWIFT_OPTIMIZATION_LEVEL=-Onone
          python3 scripts/record-replay-compiler-flags.py \
            --derived-data "$RUNNER_TEMP/ReplayDerivedData" --test-products "$RUNNER_TEMP/Replay.xctestproducts" \
            --checkout "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/replay-compiler-flags.json"
      # Replay owns process-wide SDK state; each scenario starts a fresh host.
      - name: Verify private-message replay in an isolated process
        if: ${{ !cancelled() && steps.replay-products.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("parent_regression", "scripts/run-parent-regression.py")
          regression = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(regression)
          root = Path(os.environ["RUNNER_TEMP"])
          suite = "replay-private"
          products = root / "Replay.xctestproducts"
          device = os.environ["TEST_DEVICE_ID"]
          bundle = root / (suite + ".xcresult")
          command = ["xcodebuild", "test-without-building", "-quiet", "-testProductsPath", str(products),
              "-destination", "platform=iOS Simulator,id=" + device,
              "-jobs", "2", "-parallel-testing-enabled", "NO",
              "-only-testing:WanderTests/ReplayMaskingTests/testPrivateMessageContentIsMaskedInActualReplayImage",
              "-test-timeouts-enabled", "YES", "-default-test-execution-time-allowance", "120",
              "-maximum-test-execution-time-allowance", "180",
              "-resultBundlePath", str(bundle)]
          raise SystemExit(regression.run_isolated_replay(
              suite=suite, products=products, device_id=device, result_bundle=bundle,
              command=command, receipt=root / (suite + "-host.json")))
          PY
      - name: Verify credential replay in an isolated process
        if: ${{ !cancelled() && steps.replay-products.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("parent_regression", "scripts/run-parent-regression.py")
          regression = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(regression)
          root = Path(os.environ["RUNNER_TEMP"])
          suite = "replay-credentials"
          products = root / "Replay.xctestproducts"
          device = os.environ["TEST_DEVICE_ID"]
          bundle = root / (suite + ".xcresult")
          command = ["xcodebuild", "test-without-building", "-quiet", "-testProductsPath", str(products),
              "-destination", "platform=iOS Simulator,id=" + device,
              "-jobs", "2", "-parallel-testing-enabled", "NO",
              "-only-testing:WanderTests/ReplayMaskingTests/testReadableContentAndCredentialMaskingInActualReplayImage",
              "-test-timeouts-enabled", "YES", "-default-test-execution-time-allowance", "120",
              "-maximum-test-execution-time-allowance", "180",
              "-resultBundlePath", str(bundle)]
          raise SystemExit(regression.run_isolated_replay(
              suite=suite, products=products, device_id=device, result_bundle=bundle,
              command=command, receipt=root / (suite + "-host.json")))
          PY
      - name: Verify mounted Feed replay in an isolated process
        if: ${{ !cancelled() && steps.replay-products.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("parent_regression", "scripts/run-parent-regression.py")
          regression = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(regression)
          root = Path(os.environ["RUNNER_TEMP"])
          suite = "replay-feed"
          products = root / "Replay.xctestproducts"
          device = os.environ["TEST_DEVICE_ID"]
          bundle = root / (suite + ".xcresult")
          command = ["xcodebuild", "test-without-building", "-quiet", "-testProductsPath", str(products),
              "-destination", "platform=iOS Simulator,id=" + device,
              "-jobs", "2", "-parallel-testing-enabled", "NO",
              "-only-testing:WanderTests/FeedScreenScrollingPerformanceTests/testPerformanceMountedFeedScrollWith600EventsAndActualReplay",
              "-test-timeouts-enabled", "YES", "-default-test-execution-time-allowance", "120",
              "-maximum-test-execution-time-allowance", "180",
              "-resultBundlePath", str(bundle)]
          raise SystemExit(regression.run_isolated_replay(
              suite=suite, products=products, device_id=device, result_bundle=bundle,
              command=command, receipt=root / (suite + "-host.json")))
          PY
      - name: Verify masked scrolling replay in an isolated process
        if: ${{ !cancelled() && steps.replay-products.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("parent_regression", "scripts/run-parent-regression.py")
          regression = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(regression)
          root = Path(os.environ["RUNNER_TEMP"])
          suite = "replay-masked-scroll"
          products = root / "Replay.xctestproducts"
          device = os.environ["TEST_DEVICE_ID"]
          bundle = root / (suite + ".xcresult")
          command = ["xcodebuild", "test-without-building", "-quiet", "-testProductsPath", str(products),
              "-destination", "platform=iOS Simulator,id=" + device,
              "-jobs", "2", "-parallel-testing-enabled", "NO",
              "-only-testing:WanderTests/PostHogReplayPerformanceTests/testPerformanceActualReplayMaskedScroll",
              "-test-timeouts-enabled", "YES", "-default-test-execution-time-allowance", "120",
              "-maximum-test-execution-time-allowance", "180",
              "-resultBundlePath", str(bundle)]
          raise SystemExit(regression.run_isolated_replay(
              suite=suite, products=products, device_id=device, result_bundle=bundle,
              command=command, receipt=root / (suite + "-host.json")))
          PY
      - name: Summarize native tests
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/ContactDiscovery.xcresult" --format json | tee "$RUNNER_TEMP/contact-discovery-summary.json"
          for suite in replay-private replay-credentials replay-feed replay-masked-scroll; do
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$suite.xcresult" --format json > "$RUNNER_TEMP/$suite-summary.json"
          done
      - name: Save native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-discovery-native-results
          path: |
            ${{ runner.temp }}/ContactDiscovery.xcresult
            ${{ runner.temp }}/ImportFilePerformance.xcresult
            ${{ runner.temp }}/ImportFilePerformance.summary.json
            ${{ runner.temp }}/ImportFilePerformance.tests.json
            ${{ runner.temp }}/import-file-performance-selection.json
            ${{ runner.temp }}/ImportAutoSavePerformance.xcresult
            ${{ runner.temp }}/ImportAutoSavePerformance.summary.json
            ${{ runner.temp }}/ImportAutoSavePerformance.tests.json
            ${{ runner.temp }}/import-autosave-performance-selection.json
            ${{ runner.temp }}/ImportAutoSaveWithoutListPerformance.xcresult
            ${{ runner.temp }}/ImportAutoSaveWithoutListPerformance.summary.json
            ${{ runner.temp }}/ImportAutoSaveWithoutListPerformance.tests.json
            ${{ runner.temp }}/import-autosave-no-list-performance-selection.json
            ${{ runner.temp }}/contact-discovery-summary.json
            ${{ runner.temp }}/replay-compiler-flags.json
            ${{ runner.temp }}/replay-private.xcresult
            ${{ runner.temp }}/replay-private-summary.json
            ${{ runner.temp }}/replay-private-host.json
            ${{ runner.temp }}/replay-private-host
            ${{ runner.temp }}/replay-credentials.xcresult
            ${{ runner.temp }}/replay-credentials-summary.json
            ${{ runner.temp }}/replay-credentials-host.json
            ${{ runner.temp }}/replay-credentials-host
            ${{ runner.temp }}/replay-feed.xcresult
            ${{ runner.temp }}/replay-feed-summary.json
            ${{ runner.temp }}/replay-feed-host.json
            ${{ runner.temp }}/replay-feed-host
            ${{ runner.temp }}/replay-masked-scroll.xcresult
            ${{ runner.temp }}/replay-masked-scroll-summary.json
            ${{ runner.temp }}/replay-masked-scroll-host.json
            ${{ runner.temp }}/replay-masked-scroll-host
          retention-days: 14
