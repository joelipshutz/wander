name: App Clip parent regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'WanderAppClip/**'
      - 'WanderAppClipTests/**'
      - 'WanderAppClipUITests/**'
      - '.github/workflows/app-clip-validation.yml'
      - 'scripts/run-parent-regression.py'
      - 'scripts/test_parent_regression.py'
  workflow_dispatch:
    inputs:
      observed_diagnostics:
        description: Run the bounded REC-636 diagnostic observations only
        type: boolean
        default: false
      replay_only:
        description: In observed diagnostics mode run only the instrumented private Replay job
        type: boolean
        default: false
      native_followup:
        description: In observed diagnostics mode run only the four changed native UI observations
        type: boolean
        default: false
      graphics_only:
        description: Run focused native appearance and map frame diagnostics
        type: boolean
        default: false
      runner:
        description: Standard macOS runner for a controlled rendering comparison
        type: choice
        options: [macos-26, macos-26-intel]
        default: macos-26

permissions:
  contents: read

concurrency:
  group: app-clip-parent-${{ github.ref }}
  # Preserve a complete result while fixes queue behind the active regression.
  # Only the newest pending commit is retained by the concurrency group.
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.observed_diagnostics }}
    name: Parent test build
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: true
          persist-credentials: false
      - name: Build portable test products once
        run: |
          python3 -B -m unittest discover -s scripts -p test_parent_regression.py
          brew install xcodegen
          xcodegen generate
          xcrun simctl list devices available --json > "$RUNNER_TEMP/build-devices.json"
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          devices = json.loads((Path(os.environ['RUNNER_TEMP']) / 'build-devices.json').read_text())['devices']
          choices = [(tuple(map(int, re.findall(r'\d+', runtime))), d)
                     for runtime, rows in devices.items() if 'iOS' in runtime
                     for d in rows if d['name'] == 'iPhone 17 Pro']
          assert choices, 'No existing iPhone 17 Pro simulator'
          _, device = max(choices, key=lambda item: item[0])
          # Initialize CoreSimulator before Xcode resolves a destination on a
          # fresh runner. OS:latest can otherwise expose only placeholders.
          subprocess.run(['xcrun', 'simctl', 'bootstatus', device['udid'], '-b'], check=True)
          Path(os.environ['RUNNER_TEMP'], 'build-device-id.txt').write_text(device['udid'])
          PY
          BUILD_DEVICE_ID="$(cat "$RUNNER_TEMP/build-device-id.txt")"
          xcodebuild build-for-testing -quiet -project Wander.xcodeproj -scheme Wander \
            -destination "platform=iOS Simulator,id=$BUILD_DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" -jobs 2 \
            -testProductsPath "$RUNNER_TEMP/Parent.xctestproducts" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES
          xcodebuild build-for-testing -quiet -project Wander.xcodeproj -scheme AstirClip \
            -destination "platform=iOS Simulator,id=$BUILD_DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" -jobs 2 \
            -testProductsPath "$RUNNER_TEMP/Clip.xctestproducts" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES
          git rev-parse HEAD > "$RUNNER_TEMP/test-products-commit.txt"
          xcodebuild -version > "$RUNNER_TEMP/test-products-xcode.txt"
          # Preserve executable permissions and bundle symlinks in transport.
          tar -czf "$RUNNER_TEMP/parent-test-products.tar.gz" -C "$RUNNER_TEMP" \
            Parent.xctestproducts Clip.xctestproducts test-products-commit.txt test-products-xcode.txt
      - uses: actions/upload-artifact@v4
        with:
          name: parent-test-products
          path: ${{ runner.temp }}/parent-test-products.tar.gz
          compression-level: 0
          retention-days: 2

  parent:
    if: ${{ !inputs.observed_diagnostics }}
    needs: build
    name: ${{ matrix.suite == 'clip' && 'App Clip suite' || format('Parent {0}', matrix.name) }}
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.graphics_only && '[{"name":"focused graphics diagnostics","suite":"graphics","shard":0}]' || '[{"name":"Clip suite","suite":"clip","shard":0},{"name":"unit suite","suite":"unit","shard":0},{"name":"UI performance","suite":"ui-performance","shard":0},{"name":"UI shard 1","suite":"ui","shard":0},{"name":"UI shard 2","suite":"ui","shard":1},{"name":"UI shard 3","suite":"ui","shard":2},{"name":"UI shard 4","suite":"ui","shard":3},{"name":"UI shard 5","suite":"ui","shard":4},{"name":"UI shard 6","suite":"ui","shard":5},{"name":"UI shard 7","suite":"ui","shard":6},{"name":"UI shard 8","suite":"ui","shard":7}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: true
          persist-credentials: false
      - name: Generate project and select simulator
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
          git rev-parse HEAD
          # Keep rendering capability with the test evidence when investigating
          # simulator-only animation or native material failures.
          xcrun swift -e 'import Metal; let devices = MTLCopyAllDevices(); print("CI rendering device count:", devices.count); for gpu in devices { print("CI rendering device:", gpu.name, "lowPower:", gpu.isLowPower) }'
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          devices = json.loads((Path(os.environ['RUNNER_TEMP']) / 'devices.json').read_text())['devices']
          choices = [(tuple(map(int, re.findall(r'\d+', runtime))), d)
                     for runtime, rows in devices.items() if 'iOS' in runtime
                     for d in rows if d['name'] == 'iPhone 17 Pro']
          assert choices, 'No existing iPhone 17 Pro simulator'
          runtime, device = max(choices, key=lambda item: item[0])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('TEST_DEVICE_ID=' + device['udid'] + '\n')
          print('Testing on', device['name'], 'runtime', runtime)
          import subprocess
          # Start system services before compilation, so first-boot setup is not
          # competing with the first app animation/performance measurement.
          subprocess.run(['xcrun', 'simctl', 'bootstatus', device['udid'], '-b'], check=True)
          # Initialize appearance before the restart. On a fresh iOS 26.5
          # runtime, the first appearance write reports success without updating
          # any scene, even Settings. Rebooting an untouched simulator is not
          # sufficient. Seed both values, then reboot so later live changes reach
          # native windows (verified with unchanged dark/live pixel assertions).
          subprocess.run(['xcrun', 'simctl', 'ui', device['udid'], 'appearance', 'dark'], check=True)
          subprocess.run(['xcrun', 'simctl', 'ui', device['udid'], 'appearance', 'light'], check=True)
          subprocess.run(['xcrun', 'simctl', 'shutdown', device['udid']], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', device['udid'], '-b'], check=True)
          if os.environ['TEST_SUITE'] in ('clip', 'unit', 'ui', 'ui-performance', 'graphics', 'replay'):
              # Attach the display before testing native materials and frame
              # cadence or capturing the SDK's actual replay screenshot.
              subprocess.run(['open', '-a', 'Simulator', '--args', '-CurrentDeviceUDID', device['udid']], check=True)
              subprocess.run(['xcrun', 'simctl', 'ui', device['udid'], 'appearance'], check=True)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: parent-test-products
          path: ${{ runner.temp }}
      - name: Verify and unpack test products
        run: |
          tar -xzf "$RUNNER_TEMP/parent-test-products.tar.gz" -C "$RUNNER_TEMP"
          test "$(cat "$RUNNER_TEMP/test-products-commit.txt")" = "$(git rev-parse HEAD)"
          xcodebuild -version > "$RUNNER_TEMP/current-xcode.txt"
          diff -u "$RUNNER_TEMP/test-products-xcode.txt" "$RUNNER_TEMP/current-xcode.txt"
      # Ad-hoc signing is required for Clerk's Keychain initialization in the
      # real startup path; this uses no Apple distribution identity or secrets.
      # Shared CI keeps full dense-map camera and bounded annotation-work checks.
      # Original CPU/frame timing budgets are required separately on the reference
      # simulator, matching main's deterministic shared-runner benchmark policy.
      - name: Run complete parent suite
        env:
          TEST_SUITE: ${{ matrix.suite }}
          TEST_SHARD: ${{ matrix.shard }}
          TEST_PRODUCT_NAME: ${{ matrix.suite == 'clip' && 'Clip' || 'Parent' }}
        run: >-
          python3 scripts/run-parent-regression.py --suite "$TEST_SUITE"
          --shard "$TEST_SHARD" --shard-count 8
          --destination "$TEST_DEVICE_ID" --test-products "$RUNNER_TEMP/$TEST_PRODUCT_NAME.xctestproducts"
          --result-bundle "$RUNNER_TEMP/Parent.xcresult"
          --selection-file "$RUNNER_TEMP/test-selection.json"
      # Each real-image fixture gets a separate host for process-wide SDK hooks,
      # matching Feed/Privacy. Keep the combined local mode for lifecycle work;
      # this isolation does not establish the cause of a combined CI failure.
      # Both methods remain required, once each, with their original assertions.
      - name: Run private replay proof after parent units
        if: ${{ (success() || failure()) && matrix.suite == 'unit' }}
        run: >-
          python3 scripts/run-parent-regression.py --suite replay-private
          --destination "$TEST_DEVICE_ID" --test-products "$RUNNER_TEMP/Parent.xctestproducts"
          --result-bundle "$RUNNER_TEMP/ParentReplayPrivate.xcresult"
          --selection-file "$RUNNER_TEMP/replay-private-selection.json"
      - name: Run credential replay proof after parent units
        if: ${{ (success() || failure()) && matrix.suite == 'unit' }}
        run: >-
          python3 scripts/run-parent-regression.py --suite replay-credentials
          --destination "$TEST_DEVICE_ID" --test-products "$RUNNER_TEMP/Parent.xctestproducts"
          --result-bundle "$RUNNER_TEMP/ParentReplayCredentials.xcresult"
          --selection-file "$RUNNER_TEMP/replay-credentials-selection.json"
      - name: Summarize test result
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/Parent.xcresult/Info.plist" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Parent.xcresult" --format json > "$RUNNER_TEMP/parent-summary.json"
          fi
      - name: Summarize and require both replay proofs
        if: ${{ always() && matrix.suite == 'unit' }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, subprocess
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("parent_regression", "scripts/run-parent-regression.py")
          regression = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(regression)
          root = Path(os.environ["RUNNER_TEMP"])
          problems = []
          for suite, name in [("replay-private", "ParentReplayPrivate"),
                              ("replay-credentials", "ParentReplayCredentials")]:
              bundle = root / (name + ".xcresult")
              if not (bundle / "Info.plist").is_file():
                  problems.append(suite + ": missing completed result bundle")
                  continue
              exports_ok = True
              for kind in ["summary", "tests"]:
                  try:
                      with (root / (suite + "-" + kind + ".json")).open("wb") as output:
                          result = subprocess.run(["xcrun", "xcresulttool", "get", "test-results", kind,
                                                   "--path", str(bundle), "--compact"], stdout=output, timeout=120)
                      if result.returncode:
                          problems.append(suite + ": " + kind + " export failed")
                          exports_ok = False
                  except subprocess.TimeoutExpired:
                      problems.append(suite + ": " + kind + " export timed out")
                      exports_ok = False
              if exports_ok:
                  try:
                      summary = json.loads((root / (suite + "-summary.json")).read_text())
                      tests = json.loads((root / (suite + "-tests.json")).read_text())
                      regression.validate_replay_result(suite, summary, tests, os.environ["TEST_DEVICE_ID"])
                  except (ValueError, KeyError, TypeError, AttributeError) as error:
                      problems.append(suite + ": " + str(error))
          if problems:
              raise SystemExit("\n".join(problems))
          PY
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-clip-parent-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/Parent.xcresult
            ${{ runner.temp }}/parent-summary.json
            ${{ runner.temp }}/test-selection.json
            ${{ runner.temp }}/ParentReplayPrivate.xcresult
            ${{ runner.temp }}/ParentReplayCredentials.xcresult
            ${{ runner.temp }}/replay-private-summary.json
            ${{ runner.temp }}/replay-private-tests.json
            ${{ runner.temp }}/replay-private-selection.json
            ${{ runner.temp }}/replay-credentials-summary.json
            ${{ runner.temp }}/replay-credentials-tests.json
            ${{ runner.temp }}/replay-credentials-selection.json
          retention-days: 14

  replay-private:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.observed_diagnostics && !inputs.native_followup }}
    name: Compare normal and dormant Replay roots once
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - name: Admit exact checkout, toolchain and simulator
        run: |
          set -euo pipefail
          export DIAG="$RUNNER_TEMP/rec636-v37-replay-private-diagnostic"
          printf 'DIAG=%s\n' "$DIAG" >> "$GITHUB_ENV"
          mkdir "$DIAG"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          out=Path(os.environ['DIAG'])
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['GITHUB_SHA'], 'Checkout differs from dispatch SHA'
          xcode=subprocess.check_output(['xcodebuild','-version'],text=True).strip()
          assert xcode=='Xcode 26.6\nBuild version 17F113', 'Diagnostic toolchain differs'
          runtimes=json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','--json'],text=True))['runtimes']
          admitted=[r for r in runtimes if r.get('isAvailable') and r['identifier']=='com.apple.CoreSimulator.SimRuntime.iOS-26-5']
          assert len(admitted)==1 and admitted[0]['buildversion']=='23F77', 'Diagnostic runtime differs'
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          choices=[d for runtime, rows in devices.items() if runtime=='com.apple.CoreSimulator.SimRuntime.iOS-26-5'
                   for d in rows if d['name']=='iPhone 17 Pro' and d.get('isAvailable')]
          assert len(choices)==1, 'Require one existing iPhone 17 Pro iOS26.5'
          device=choices[0]
          (out/'device-id.txt').write_text(device['udid']+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('DEVICE_ID='+device['udid']+'\n')
          (out/'admission.json').write_text(json.dumps({'dispatchSHA':head,'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'xcode':xcode,'deviceID':device['udid'],'deviceModel':'iPhone 17 Pro','runtime':'iOS26.5','runtimeBuild':'23F77','retries':0,'diagnosticOnly':True,'releaseAcceptance':False,'priorFullUnitSequenceReproduced':False},indent=2)+'\n')
          PY
          DEVICE_ID="$(cat "$DIAG/device-id.txt")"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance dark
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl shutdown "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_ID"
          xcrun simctl ui "$DEVICE_ID" appearance
      - name: Resolve canonical pinned packages in the job-owned cache
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project Wander.xcodeproj -scheme Wander \
            -clonedSourcePackagesDirPath "$DIAG/SourcePackages" -onlyUsePackageVersionsFromResolvedFile
      - name: Verify originals and apply only diagnostic patches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['DIAG']);root=Path(os.environ['GITHUB_WORKSPACE']);sdk=out/'SourcePackages/checkouts/posthog-ios'
          proof=json.loads((root/'scripts/diagnostics/source-proof.json').read_text())
          assert subprocess.check_output(['git','-C',str(sdk),'rev-parse','HEAD'],text=True).strip()==proof['SDKRevision']
          rows=[]
          for row in proof['files']:
              path=(sdk if row['role']=='sdk' else root)/row['path']
              actual=hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual==row['originalSHA256'], 'Original diagnostic input differs'
              rows.append({'role':row['role'],'path':row['path'],'originalSHA256':actual,'proposedSHA256':row['proposedSHA256']})
          (out/'original-source-fingerprints.json').write_text(json.dumps({'SDKRevision':proof['SDKRevision'],'files':rows},indent=2)+'\n')
          for directory,name in [(sdk,'sdk-only.patch'),(root,'host-only.patch'),(root,'test-only.patch')]:
              patch=root/'scripts/diagnostics'/name
              subprocess.run(['git','-C',str(directory),'apply','--check',str(patch)],check=True)
              subprocess.run(['git','-C',str(directory),'apply',str(patch)],check=True)
          for row in rows:
              path=(sdk if row['role']=='sdk' else root)/row['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==row['proposedSHA256'], 'Proposed source differs'
          (out/'applied-source-fingerprints.json').write_text(json.dumps({'files':rows,'originalsVerified':True,'proposalsVerified':True,'sharedCachesModified':False},indent=2)+'\n')
          PY
      - name: Build diagnostic parent products once
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -quiet -project Wander.xcodeproj -scheme Wander \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$DIAG/DerivedData" -clonedSourcePackagesDirPath "$DIAG/SourcePackages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -jobs 2 \
            -testProductsPath "$DIAG/Parent.xctestproducts" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['DIAG']);root=Path(os.environ['GITHUB_WORKSPACE']);sdk=out/'SourcePackages/checkouts/posthog-ios'
          rows=json.loads((out/'applied-source-fingerprints.json').read_text())['files']
          for row in rows:
              path=(sdk if row['role']=='sdk' else root)/row['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==row['proposedSHA256'], 'Build changed patched source'
          products=out/'Parent.xctestproducts';assert (products/'Info.plist').is_file()
          files={str(p.relative_to(products)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(products.rglob('*')) if p.is_file() and not p.is_symlink()}
          (out/'diagnostic-build-fingerprints.json').write_text(json.dumps({'sourceHashesStillMatch':True,'productFiles':files},indent=2)+'\n')
          PY
      - name: Compare original private Replay with normal and dormant roots
        run: |
          set -euo pipefail
          python3 scripts/diagnostics/replay-host-comparison.py \
            --out "$DIAG" --products "$DIAG/Parent.xctestproducts" --device "$DEVICE_ID"
      - name: Record generated phlibwebp compilation arguments
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/diagnostics/collect-c-flags.py \
            --derived-data "$DIAG/DerivedData" --output "$DIAG/phlibwebp-c-flags.json"
      - name: Retain final observed source identities
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['DIAG']);out.mkdir(exist_ok=True)
          root=Path(os.environ['GITHUB_WORKSPACE']);sdk=out/'SourcePackages/checkouts/posthog-ios';rows=[]
          proof=root/'scripts/diagnostics/source-proof.json'
          if proof.is_file():
              for row in json.loads(proof.read_text())['files']:
                  p=(sdk if row['role']=='sdk' else root)/row['path']
                  rows.append({'role':row['role'],'path':row['path'],'exists':p.is_file(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None})
          (out/'final-source-fingerprints.json').write_text(json.dumps({'files':rows,'diagnosticOnly':True,'releaseAcceptance':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rec636-v40-replay-host-cpu-comparison
          path: |
            ${{ runner.temp }}/rec636-v37-replay-private-diagnostic/*.json
            ${{ runner.temp }}/rec636-v37-replay-private-diagnostic/normal
            ${{ runner.temp }}/rec636-v37-replay-private-diagnostic/dormant
          if-no-files-found: warn
          retention-days: 7

  native-inputs:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.observed_diagnostics && !inputs.replay_only }}
    name: Observe native input and onboarding once
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Admit source, toolchain and existing devices
        run: |
          set -euo pipefail
          python3 scripts/diagnostics/native-input-diagnostic.py admit --out "$RUNNER_TEMP/native-input-evidence"
          brew install xcodegen
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project Wander.xcodeproj -scheme Wander \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/CanonicalPackages" \
            -onlyUsePackageVersionsFromResolvedFile
      - name: Initialize exact large diagnostic phone
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$DIAG_LARGE" -b
          xcrun simctl ui "$DIAG_LARGE" appearance dark
          xcrun simctl ui "$DIAG_LARGE" appearance light
          xcrun simctl shutdown "$DIAG_LARGE"
          xcrun simctl bootstatus "$DIAG_LARGE" -b
          open -a Simulator --args -CurrentDeviceUDID "$DIAG_LARGE"
      - name: Build canonical SDK and observed app once
        id: native_build
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -quiet -project Wander.xcodeproj -scheme Wander \
            -destination "platform=iOS Simulator,id=$DIAG_LARGE" \
            -derivedDataPath "$RUNNER_TEMP/NativeDiagnosticDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/CanonicalPackages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -jobs 2 \
            -testProductsPath "$RUNNER_TEMP/NativeDiagnostic.xctestproducts" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES \
            > "$RUNNER_TEMP/native-input-evidence/build.log" 2>&1
          python3 scripts/diagnostics/native-input-diagnostic.py verify-build \
            --out "$RUNNER_TEMP/native-input-evidence" \
            --products "$RUNNER_TEMP/NativeDiagnostic.xctestproducts" \
            --packages "$RUNNER_TEMP/CanonicalPackages"
      - name: Run selected large diagnostic cases once each
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          python3 scripts/diagnostics/native-input-diagnostic.py run --role large ${{ inputs.native_followup && '--followup' || '' }} \
            --out "$RUNNER_TEMP/native-input-evidence" \
            --products "$RUNNER_TEMP/NativeDiagnostic.xctestproducts"
      - name: Prepare exact compact phone
        id: compact_ready
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$DIAG_LARGE"
          xcrun simctl bootstatus "$DIAG_COMPACT" -b
          open -a Simulator --args -CurrentDeviceUDID "$DIAG_COMPACT"
      - name: Run selected compact diagnostic cases once each
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && steps.compact_ready.outcome == 'success' }}
        run: |
          python3 scripts/diagnostics/native-input-diagnostic.py run --role compact ${{ inputs.native_followup && '--followup' || '' }} \
            --out "$RUNNER_TEMP/native-input-evidence" \
            --products "$RUNNER_TEMP/NativeDiagnostic.xctestproducts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rec636-v37-native-input-diagnostic
          path: ${{ runner.temp }}/native-input-evidence
