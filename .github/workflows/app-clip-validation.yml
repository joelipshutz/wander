name: REC-636 focused diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rec636-focused-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  replay-private:
    name: Instrumented private replay once
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - name: Admit exact checkout, toolchain and simulator
        run: |
          set -euo pipefail
          export DIAG="$RUNNER_TEMP/rec636-replay-private-diagnostic"
          printf 'DIAG=%s\n' "$DIAG" >> "$GITHUB_ENV"
          mkdir "$DIAG"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          out=Path(os.environ['DIAG'])
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['GITHUB_SHA'], 'Checkout differs from dispatch SHA'
          xcode=subprocess.check_output(['xcodebuild','-version'],text=True).strip()
          assert xcode=='Xcode 26.6\nBuild version 17F113', 'Diagnostic toolchain differs'
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          choices=[d for runtime, rows in devices.items() if runtime=='com.apple.CoreSimulator.SimRuntime.iOS-26-5'
                   for d in rows if d['name']=='iPhone 17 Pro' and d.get('isAvailable')]
          assert len(choices)==1, 'Require one existing iPhone 17 Pro iOS26.5'
          device=choices[0]
          (out/'device-id.txt').write_text(device['udid']+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('DEVICE_ID='+device['udid']+'\n')
          (out/'admission.json').write_text(json.dumps({'dispatchSHA':head,'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'xcode':xcode,'deviceID':device['udid'],'deviceModel':'iPhone 17 Pro','runtime':'iOS26.5','retries':0},indent=2)+'\n')
          PY
          DEVICE_ID="$(cat "$DIAG/device-id.txt")"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance dark
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl shutdown "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_ID"
          xcrun simctl ui "$DEVICE_ID" appearance
      - name: Resolve canonical pinned packages in the job-owned cache
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project Wander.xcodeproj -scheme Wander \
            -clonedSourcePackagesDirPath "$DIAG/SourcePackages" -onlyUsePackageVersionsFromResolvedFile
      - name: Verify originals and apply only diagnostic patches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['DIAG']);root=Path(os.environ['GITHUB_WORKSPACE']);sdk=out/'SourcePackages/checkouts/posthog-ios'
          proof=json.loads((root/'scripts/diagnostics/source-proof.json').read_text())
          assert subprocess.check_output(['git','-C',str(sdk),'rev-parse','HEAD'],text=True).strip()==proof['SDKRevision']
          rows=[]
          for row in proof['files']:
              path=(sdk if row['role']=='sdk' else root)/row['path']
              actual=hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual==row['originalSHA256'], 'Original diagnostic input differs'
              rows.append({'role':row['role'],'path':row['path'],'originalSHA256':actual,'proposedSHA256':row['proposedSHA256']})
          (out/'original-source-fingerprints.json').write_text(json.dumps({'SDKRevision':proof['SDKRevision'],'files':rows},indent=2)+'\n')
          for directory,name in [(sdk,'sdk-only.patch'),(root,'test-only.patch')]:
              patch=root/'scripts/diagnostics'/name
              subprocess.run(['git','-C',str(directory),'apply','--check',str(patch)],check=True)
              subprocess.run(['git','-C',str(directory),'apply',str(patch)],check=True)
          for row in rows:
              path=(sdk if row['role']=='sdk' else root)/row['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==row['proposedSHA256'], 'Proposed source differs'
          (out/'applied-source-fingerprints.json').write_text(json.dumps({'files':rows,'originalsVerified':True,'proposalsVerified':True,'sharedCachesModified':False},indent=2)+'\n')
          PY
      - name: Build diagnostic parent products once
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -quiet -project Wander.xcodeproj -scheme Wander \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$DIAG/DerivedData" -clonedSourcePackagesDirPath "$DIAG/SourcePackages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -jobs 2 \
            -testProductsPath "$DIAG/Parent.xctestproducts" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['DIAG']);root=Path(os.environ['GITHUB_WORKSPACE']);sdk=out/'SourcePackages/checkouts/posthog-ios'
          rows=json.loads((out/'applied-source-fingerprints.json').read_text())['files']
          for row in rows:
              path=(sdk if row['role']=='sdk' else root)/row['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==row['proposedSHA256'], 'Build changed patched source'
          products=out/'Parent.xctestproducts';assert (products/'Info.plist').is_file()
          files={str(p.relative_to(products)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(products.rglob('*')) if p.is_file() and not p.is_symlink()}
          (out/'diagnostic-build-fingerprints.json').write_text(json.dumps({'sourceHashesStillMatch':True,'productFiles':files},indent=2)+'\n')
          PY
      - name: Run original private replay selection once
        run: |
          set -euo pipefail
          set +e
          python3 scripts/run-parent-regression.py --suite replay-private \
            --test-products "$DIAG/Parent.xctestproducts" --destination "$DEVICE_ID" \
            --result-bundle "$DIAG/ParentReplayPrivate.xcresult" --selection-file "$DIAG/selection.json"
          code=$?
          set -e
          printf '{"nativeExitCode":%s,"retries":0}\n' "$code" > "$DIAG/native-process.json"
          exit "$code"
      - name: Retain actual result metadata and aggregate diagnostics
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          out=Path(os.environ['DIAG']);out.mkdir(exist_ok=True)
          root=Path(os.environ['GITHUB_WORKSPACE']);sdk=out/'SourcePackages/checkouts/posthog-ios';rows=[]
          proof=root/'scripts/diagnostics/source-proof.json'
          if proof.is_file():
              for row in json.loads(proof.read_text())['files']:
                  p=(sdk if row['role']=='sdk' else root)/row['path']
                  rows.append({'role':row['role'],'path':row['path'],'exists':p.is_file(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None})
          (out/'final-source-fingerprints.json').write_text(json.dumps({'files':rows,'diagnosticOnly':True,'releaseAcceptance':False},indent=2)+'\n')
          bundle=out/'ParentReplayPrivate.xcresult';exports=[]
          if (bundle/'Info.plist').is_file():
              before=hashlib.sha256((bundle/'Info.plist').read_bytes()).hexdigest()
              for kind in ['summary','tests']:
                  with (out/(kind+'.json')).open('wb') as f:
                      result=subprocess.run(['xcrun','xcresulttool','get','test-results',kind,'--path',str(bundle),'--compact'],stdout=f,timeout=120)
                  exports.append({'kind':kind,'exitCode':result.returncode})
              result=subprocess.run(['xcrun','xcresulttool','export','attachments','--path',str(bundle),'--output-path',str(out/'attachments')],timeout=120)
              exports.append({'kind':'attachments','exitCode':result.returncode})
              after=hashlib.sha256((bundle/'Info.plist').read_bytes()).hexdigest()
              (out/'export-receipt.json').write_text(json.dumps({'exports':exports,'InfoBeforeSHA256':before,'InfoAfterSHA256':after,'InfoUnchanged':before==after,'noRerun':True},indent=2)+'\n')
              assert before==after and all(r['exitCode']==0 for r in exports), 'Retained export incomplete'
          else:
              (out/'export-receipt.json').write_text(json.dumps({'state':'no-completed-bundle','exports':exports,'noRerun':True},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rec636-replay-private-sdk-diagnostic
          path: |
            ${{ runner.temp }}/rec636-replay-private-diagnostic/*.json
            ${{ runner.temp }}/rec636-replay-private-diagnostic/attachments
            ${{ runner.temp }}/rec636-replay-private-diagnostic/ParentReplayPrivate.xcresult
          if-no-files-found: warn
          retention-days: 7

  canonical-ui-inputs:
    name: Canonical SDK focused native inputs
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - name: Record exact source and choose existing iOS 26.5 phones
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/canonical-ui-evidence"
          xcodebuild -version > "$RUNNER_TEMP/canonical-ui-evidence/xcode-version.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/canonical-ui-evidence/checkout-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/canonical-ui-evidence/checkout-tree.txt"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/canonical-devices.json"
          xcrun simctl list runtimes --json > "$RUNNER_TEMP/canonical-runtimes.json"
          python3 - <<'PY_SETUP'
          import hashlib, json, os
          from pathlib import Path
          import subprocess
          root = Path(os.environ['RUNNER_TEMP'])
          evidence = root / 'canonical-ui-evidence'
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert (evidence/'xcode-version.txt').read_text().splitlines() == ['Xcode 26.6','Build version 17F113'], 'Required Xcode toolchain mismatch'
          expected = {
              'WanderUITests/MapFilterInteractionUITests.swift': '96506b0fe8a659b5209469fa7b69a6c0b26c8295e827fba9d2c5e73148884b32',
              'WanderUITests/LiveReviewContinuityUITests.swift': 'a0a23fdee88002344efda7ef0eabb4ab970bba52781d18964c0bbd53f6f06ca3',
              'Wander.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved': 'ed0665b30b67be70370acad6ca584589e0b1e70b059a4c799628a270a0253ac3'}
          for name, digest in expected.items():
              assert sha(Path(name)) == digest, 'Unexpected canonical diagnostic input: ' + name
          tracked = subprocess.check_output(['git','ls-files','-z','--','*.swift']).decode().split('\0')
          sources = {name: sha(Path(name)) for name in tracked if name}
          assert len(sources) == 447, 'Unexpected Swift source inventory'
          (evidence/'source-before.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'], 'swift':sources, 'requiredInputs':expected}, indent=2)+'\n')
          runtimes = json.loads((root/'canonical-runtimes.json').read_text())['runtimes']
          matches = [r for r in runtimes if r.get('isAvailable') and r.get('version') == '26.5' and 'iOS' in r['identifier']]
          assert len(matches) == 1, 'Exactly one available iOS 26.5 runtime is required; do not install or substitute'
          runtime = matches[0]
          assert runtime.get('buildversion') == '23F77', 'Required iOS26.5 runtime build mismatch'
          devices = json.loads((root/'canonical-devices.json').read_text())['devices'].get(runtime['identifier'], [])
          def choose(names):
              for name in names:
                  rows = [d for d in devices if d.get('isAvailable') and d['name'] == name]
                  if rows:
                      assert len(rows) == 1, 'Ambiguous existing diagnostic phone'
                      return rows[0]
              raise RuntimeError('No supported existing phone in exact iOS 26.5 runtime')
          pro = choose(['iPhone 17 Pro'])
          compact = choose(['iPhone 17e','iPhone 16e','iPhone SE (3rd generation)'])
          assert pro['udid'] != compact['udid']
          selected = {'runtime':{k:runtime[k] for k in ['identifier','version','buildversion']}, 'performance':pro, 'combinedLarge':pro, 'combinedCompact':compact}
          (evidence/'selected-devices.json').write_text(json.dumps(selected, indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('CANONICAL_PRO='+pro['udid']+'\nCANONICAL_COMPACT='+compact['udid']+'\n')
          PY_SETUP
          brew install xcodegen
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project Wander.xcodeproj -scheme Wander \
            -derivedDataPath "$RUNNER_TEMP/CanonicalDerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            > "$RUNNER_TEMP/canonical-ui-evidence/package-resolution.log" 2>&1
      - name: Initialize the selected performance phone
        run: |
          # Match the existing App Clip performance host's display initialization.
          xcrun simctl bootstatus "$CANONICAL_PRO" -b
          xcrun simctl ui "$CANONICAL_PRO" appearance dark
          xcrun simctl ui "$CANONICAL_PRO" appearance light
          xcrun simctl shutdown "$CANONICAL_PRO"
          xcrun simctl bootstatus "$CANONICAL_PRO" -b
          open -a Simulator --args -CurrentDeviceUDID "$CANONICAL_PRO"
      - name: Build the canonical SDK harness once
        id: canonical_build
        run: |
          xcodebuild build-for-testing -quiet -project Wander.xcodeproj -scheme Wander \
            -destination "platform=iOS Simulator,id=$CANONICAL_PRO" \
            -derivedDataPath "$RUNNER_TEMP/CanonicalDerivedData" -jobs 2 \
            -testProductsPath "$RUNNER_TEMP/Canonical.xctestproducts" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -only-testing:WanderUITests/MapFilterInteractionUITests/testPerformanceFixtureMeasuresSelectedPinPanCPUAndAnnotationWork \
            -only-testing:WanderUITests/LiveDrawerAndFilterUITests/testCombinedFiltersApplyCancelAndResetKeepMapAndFeedInAgreement \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES \
            > "$RUNNER_TEMP/canonical-ui-evidence/build.log" 2>&1
          python3 - <<'PY_SDK'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          evidence = root/'canonical-ui-evidence'
          sdk = root/'CanonicalDerivedData/SourcePackages/checkouts/posthog-ios'
          revision = subprocess.check_output(['git','-C',str(sdk),'rev-parse','HEAD'],text=True).strip()
          assert revision == 'ee5b5705b0038f0c44646cde5fe972bb65387596', 'Canonical SDK revision changed'
          assert subprocess.check_output(['git','-C',str(sdk),'status','--porcelain','--untracked-files=all']) == b'', 'Canonical SDK checkout is modified'
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          before = json.loads((evidence/'source-before.json').read_text())
          assert all(sha(Path(name)) == digest for name,digest in before['swift'].items())
          assert all(sha(Path(name)) == digest for name,digest in before['requiredInputs'].items())
          (evidence/'canonical-sdk.json').write_text(json.dumps({'revision':revision,'version':'3.61.0','workingTreeClean':True,'sdkPatchApplied':False,'replayTestPatchApplied':False},indent=2)+'\n')
          products = root/'Canonical.xctestproducts'
          for name in ['Wander.app','WanderUITests-Runner.app']:
              subprocess.run(['codesign','--verify','--deep','--strict',str(products/'Binaries/0/Debug-iphonesimulator'/name)],check=True)
          hashes = {str(p.relative_to(products)):sha(p) for p in products.rglob('*') if p.is_file() and not p.is_symlink()}
          (evidence/'product-file-hashes.json').write_text(json.dumps(hashes,sort_keys=True)+'\n')
          PY_SDK
      - name: Run selected-pin performance once
        if: ${{ !cancelled() && steps.canonical_build.outcome == 'success' }}
        run: |
          set +e
          xcodebuild test-without-building -quiet -testProductsPath "$RUNNER_TEMP/Canonical.xctestproducts" \
            -destination "platform=iOS Simulator,id=$CANONICAL_PRO" -jobs 2 -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -maximum-test-execution-time-allowance 900 \
            -only-testing:WanderUITests/MapFilterInteractionUITests/testPerformanceFixtureMeasuresSelectedPinPanCPUAndAnnotationWork \
            -resultBundlePath "$RUNNER_TEMP/performance.xcresult" \
            > "$RUNNER_TEMP/canonical-ui-evidence/performance.log" 2>&1
          rc=$?
          printf '%s\n' "$rc" > "$RUNNER_TEMP/canonical-ui-evidence/performance-exit-code.txt"
          exit "$rc"
      - name: Run CombinedFilters once on the large phone
        if: ${{ !cancelled() && steps.canonical_build.outcome == 'success' }}
        run: |
          set +e
          xcodebuild test-without-building -quiet -testProductsPath "$RUNNER_TEMP/Canonical.xctestproducts" \
            -destination "platform=iOS Simulator,id=$CANONICAL_PRO" -jobs 2 -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -maximum-test-execution-time-allowance 900 \
            -only-testing:WanderUITests/LiveDrawerAndFilterUITests/testCombinedFiltersApplyCancelAndResetKeepMapAndFeedInAgreement \
            -resultBundlePath "$RUNNER_TEMP/combined-large.xcresult" \
            > "$RUNNER_TEMP/canonical-ui-evidence/combined-large.log" 2>&1
          rc=$?
          printf '%s\n' "$rc" > "$RUNNER_TEMP/canonical-ui-evidence/combined-large-exit-code.txt"
          exit "$rc"
      - name: Release large phone and prepare the Feed compact selection
        id: canonical_compact_ready
        if: ${{ !cancelled() && steps.canonical_build.outcome == 'success' }}
        run: |
          xcrun simctl shutdown "$CANONICAL_PRO"
          xcrun simctl bootstatus "$CANONICAL_COMPACT" -b
          open -a Simulator --args -CurrentDeviceUDID "$CANONICAL_COMPACT"
      - name: Run CombinedFilters once on the compact phone
        if: ${{ !cancelled() && steps.canonical_build.outcome == 'success' && steps.canonical_compact_ready.outcome == 'success' }}
        run: |
          set +e
          xcodebuild test-without-building -quiet -testProductsPath "$RUNNER_TEMP/Canonical.xctestproducts" \
            -destination "platform=iOS Simulator,id=$CANONICAL_COMPACT" -jobs 2 -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -maximum-test-execution-time-allowance 900 \
            -only-testing:WanderUITests/LiveDrawerAndFilterUITests/testCombinedFiltersApplyCancelAndResetKeepMapAndFeedInAgreement \
            -resultBundlePath "$RUNNER_TEMP/combined-compact.xcresult" \
            > "$RUNNER_TEMP/canonical-ui-evidence/combined-compact.log" 2>&1
          rc=$?
          printf '%s\n' "$rc" > "$RUNNER_TEMP/canonical-ui-evidence/combined-compact-exit-code.txt"
          exit "$rc"
      - name: Preserve all three native outcomes and original attachments
        if: always()
        run: |
          python3 - <<'PY_EVIDENCE'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          evidence = root/'canonical-ui-evidence'
          evidence.mkdir(exist_ok=True)
          devices = json.loads((evidence/'selected-devices.json').read_text()) if (evidence/'selected-devices.json').exists() else {}
          expected = [
              ('performance','MapFilterInteractionUITests/testPerformanceFixtureMeasuresSelectedPinPanCPUAndAnnotationWork()',devices.get('performance',{}).get('udid')),
              ('combined-large','LiveDrawerAndFilterUITests/testCombinedFiltersApplyCancelAndResetKeepMapAndFeedInAgreement()',devices.get('combinedLarge',{}).get('udid')),
              ('combined-compact','LiveDrawerAndFilterUITests/testCombinedFiltersApplyCancelAndResetKeepMapAndFeedInAgreement()',devices.get('combinedCompact',{}).get('udid'))]
          def nodes(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from nodes(v)
              elif isinstance(x,list):
                  for v in x: yield from nodes(v)
          problems=[]; outcomes=[]
          for label,identifier,device in expected:
              bundle=root/(label+'.xcresult')
              if not (bundle/'Info.plist').is_file():
                  problems.append(label+': completed bundle missing');continue
              results={}
              for kind in ['summary','tests']:
                  p=subprocess.run(['xcrun','xcresulttool','get','test-results',kind,'--path',str(bundle),'--compact'],capture_output=True,timeout=120)
                  (evidence/(label+'-'+kind+'.json')).write_bytes(p.stdout)
                  if p.returncode: problems.append(label+': '+kind+' export failed')
                  else: results[kind]=json.loads(p.stdout)
              p=subprocess.run(['xcrun','xcresulttool','get','object','--legacy','--path',str(bundle),'--format','json'],capture_output=True,timeout=120)
              (evidence/(label+'-legacy.json')).write_bytes(p.stdout)
              if p.returncode:problems.append(label+': legacy export failed')
              url='test://com.apple.xcode/Wander/WanderUITests/'+identifier.removesuffix('()')
              for kind,argv,limit in [
                  ('activities',['xcrun','xcresulttool','get','test-results','activities','--path',str(bundle),'--test-id',url,'--compact'],120),
                  ('attachments',['xcrun','xcresulttool','export','attachments','--path',str(bundle),'--test-id',url,'--output-path',str(evidence/(label+'-attachments'))],300)]:
                  p=subprocess.run(argv,capture_output=True,timeout=limit)
                  if kind=='activities':(evidence/(label+'-activities.json')).write_bytes(p.stdout)
                  if p.returncode:problems.append(label+': '+kind+' export failed')
              if not {'summary','tests'}<=results.keys():continue
              s=results['summary'];cases=[n for n in nodes(results['tests']) if n.get('nodeType')=='Test Case']
              actualdevice=s.get('devicesAndConfigurations',[])
              rcfile=evidence/(label+'-exit-code.txt');rc=int(rcfile.read_text()) if rcfile.exists() else None
              passed=(rc==0 and {k:s.get(k) for k in ['result','totalTestCount','passedTests','failedTests','skippedTests','expectedFailures']}=={'result':'Passed','totalTestCount':1,'passedTests':1,'failedTests':0,'skippedTests':0,'expectedFailures':0} and len(cases)==1 and cases[0].get('nodeIdentifier')==identifier and cases[0].get('result')=='Passed' and not any(n.get('nodeType')=='Failure Message' for n in nodes(cases[0])) and not s.get('testFailures') and len(actualdevice)==1 and actualdevice[0].get('device',{}).get('deviceId')==device)
              outcomes.append({'label':label,'expectedIdentifier':identifier,'expectedDevice':device,'exitCode':rc,'nativeSummaryResult':s.get('result'),'exactDiagnosticCasePassed':passed,'InfoSHA256':hashlib.sha256((bundle/'Info.plist').read_bytes()).hexdigest()})
              if not passed:problems.append(label+': exact diagnostic case did not pass')
          if (evidence/'source-before.json').exists():
              before=json.loads((evidence/'source-before.json').read_text())
              for name,digest in {**before['swift'],**before['requiredInputs']}.items():
                  if hashlib.sha256(Path(name).read_bytes()).hexdigest()!=digest:problems.append('Source changed: '+name)
          sdk=root/'CanonicalDerivedData/SourcePackages/checkouts/posthog-ios'
          if (evidence/'canonical-sdk.json').exists():
              if subprocess.check_output(['git','-C',str(sdk),'rev-parse','HEAD'],text=True).strip()!='ee5b5705b0038f0c44646cde5fe972bb65387596':problems.append('Canonical SDK revision changed')
              if subprocess.check_output(['git','-C',str(sdk),'status','--porcelain','--untracked-files=all']):problems.append('Canonical SDK source changed')
          if (evidence/'product-file-hashes.json').exists():
              products=root/'Canonical.xctestproducts'
              actual={str(p.relative_to(products)):hashlib.sha256(p.read_bytes()).hexdigest() for p in products.rglob('*') if p.is_file() and not p.is_symlink()}
              if actual!=json.loads((evidence/'product-file-hashes.json').read_text()):problems.append('Built product files changed')
          record={'scope':'focused reproduction only; not final CI acceptance','attemptsPerCase':1,'outcomes':outcomes,'problems':problems,'historicalFailuresReclassified':False,'canonicalSDKPatchApplied':False,'warningsRemainInOriginalLegacyMetadata':True}
          (evidence/'diagnostic-accounting.json').write_text(json.dumps(record,indent=2)+'\n')
          if problems:raise SystemExit(1)
          PY_EVIDENCE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rec636-canonical-ui-inputs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/canonical-ui-evidence
            ${{ runner.temp }}/performance.xcresult
            ${{ runner.temp }}/combined-large.xcresult
            ${{ runner.temp }}/combined-compact.xcresult
          retention-days: 14
