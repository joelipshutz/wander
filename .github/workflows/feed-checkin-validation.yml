name: REC-636 passive Replay stages (diagnostic only)
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed diagnostic workflow commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: rec636-passive-replay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  private-stages:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DIAGNOSTIC_HEAD: ${{ inputs.expected_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require reviewed dispatch
        run: test "$DIAGNOSTIC_HEAD" = "$GITHUB_SHA"
      - uses: actions/checkout@v4
        with:
          ref: 6f149bff202b839425ea7b6469c77813709070c4
          path: native
          lfs: true
          persist-credentials: false
      - name: Admit exact source, toolchain and runtime
        run: python3 scripts/diagnostics/rec636-replay-stages.py admit
      - name: Resolve the pinned SDK in the disposable job cache
        working-directory: native
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project Wander.xcodeproj -scheme Wander \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/rec636-replay-stages/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile
      - name: Instrument and build once, restoring source and modes
        id: build
        run: python3 scripts/diagnostics/rec636-replay-stages.py build
      - name: Verify source restoration
        if: always()
        run: python3 scripts/diagnostics/rec636-replay-stages.py verify-restoration
      - name: Prepare the original fresh same-model Replay startup
        id: fixture
        if: ${{ success() && steps.build.outcome == 'success' }}
        run: python3 scripts/diagnostics/rec636-replay-stages.py prepare
      - name: Run the unchanged private case once
        if: ${{ success() && steps.fixture.outcome == 'success' }}
        run: python3 scripts/diagnostics/rec636-replay-stages.py test
      - name: Export original diagnostic result
        if: always()
        run: python3 scripts/diagnostics/rec636-replay-stages.py export
      - name: Clean up only the owned diagnostic simulator
        if: always()
        run: python3 scripts/diagnostics/rec636-replay-stages.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rec636-private-replay-stages
          retention-days: 7
          path: |
            ${{ runner.temp }}/rec636-replay-stages/*.json
            ${{ runner.temp }}/rec636-replay-stages/replay-private.xcresult
            ${{ runner.temp }}/rec636-replay-stages/replay-private-host
            ${{ runner.temp }}/rec636-replay-stages/evidence
            ${{ runner.temp }}/rec636-replay-stages/replay-simulator-fixture
