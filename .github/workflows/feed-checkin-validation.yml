name: REC-636 Replay stage diagnostic

on:
  push:
    branches: [codex/rec636-replay-stage-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rec636-replay-stages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.ref == 'refs/heads/codex/rec636-replay-stage-diagnostics'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - name: Prepare scoped headless Replay diagnostic
        run: |
          brew install xcodegen
          xcodegen generate
          python3 -B -m unittest discover -s scripts/diagnostics -p test_replay_stage_diagnostic.py
          python3 - <<'PYCODE'
          import json, os, re, subprocess
          from pathlib import Path
          rows=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          choices=[(tuple(map(int,re.findall(r'\d+',runtime))),d) for runtime,devices in rows.items() if 'iOS' in runtime for d in devices if d['name']=='iPhone 17 Pro']
          assert choices, 'Required iPhone 17 Pro missing'
          device=max(choices,key=lambda row:row[0])[1]['udid']
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('REPLAY_DEVICE_ID='+device+'\n')
          out=Path(os.environ['RUNNER_TEMP'])/'rec636-stage-diagnostic';out.mkdir()
          (out/'source.json').write_text(json.dumps({'head':os.environ['GITHUB_SHA'],'device':device,'diagnosticOnly':True}))
          subprocess.run(['xcrun','simctl','bootstatus',device,'-b'],check=True)
          PYCODE
      - name: Resolve pinned packages into fresh CI checkout
        run: |
          test ! -e "$RUNNER_TEMP/ReplayPackages"
          xcodebuild -resolvePackageDependencies -project Wander.xcodeproj -scheme Wander \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/ReplayPackages" \
            -onlyUsePackageVersionsFromResolvedFile
          python3 -B scripts/diagnostics/replay-stage-diagnostic.py patch \
            --sdk "$RUNNER_TEMP/ReplayPackages/checkouts/posthog-ios" \
            --receipt "$RUNNER_TEMP/rec636-stage-diagnostic/sdk-patch.json"
      - name: Build the diagnostic SDK with unchanged original tests
        id: products
        run: |
          xcodebuild build-for-testing -quiet -project Wander.xcodeproj -scheme Wander \
            -destination "platform=iOS Simulator,id=$REPLAY_DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" -jobs 2 \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/ReplayPackages" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -parallel-testing-enabled NO \
            -only-testing:WanderTests/ReplayMaskingTests \
            -testProductsPath "$RUNNER_TEMP/Diagnostic.xctestproducts" \
            -resultBundlePath "$RUNNER_TEMP/rec636-stage-diagnostic/build.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES
      - name: Run original private Replay once and retain scalar SDK stages
        if: ${{ !cancelled() && steps.products.outcome == 'success' }}
        run: |
          python3 -B scripts/diagnostics/replay-stage-diagnostic.py run \
            --products "$RUNNER_TEMP/Diagnostic.xctestproducts" \
            --device "$REPLAY_DEVICE_ID" \
            --result "$RUNNER_TEMP/rec636-stage-diagnostic/replay.xcresult" \
            --output "$RUNNER_TEMP/rec636-stage-diagnostic/observation" \
            --sdk "$RUNNER_TEMP/ReplayPackages/checkouts/posthog-ios" \
            --receipt "$RUNNER_TEMP/rec636-stage-diagnostic/sdk-patch.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rec636-replay-stage-diagnostic
          path: ${{ runner.temp }}/rec636-stage-diagnostic
          retention-days: 7
          if-no-files-found: error
