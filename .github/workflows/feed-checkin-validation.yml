name: Feed and check-in native validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'Wander/Features/Feed/**'
      - 'Wander/Features/Activity/**'
      - 'Wander/Features/Add/PlaceSaveAttributePolicy.swift'
      - 'Wander/Features/Map/MapScreen.swift'
      - 'Wander/Features/Live/LiveScreen.swift'
      - 'Wander/DesignSystem/PersonMentionField.swift'
      - 'WanderTests/PersonMention*Tests.swift'
      - 'Wander/Services/FeedModels.swift'
      - 'Wander/Services/ActivityEngagementModels.swift'
      - 'Wander/Services/WanderLocalStore.swift'
      - 'WanderTests/Feed*Tests.swift'
      - 'WanderTests/ActivityEngagementTests.swift'
      - 'WanderTests/CheckInQuestionPreferencesTests.swift'
      - 'WanderTests/ReplayMaskingTests.swift'
      - 'WanderTests/WanderStoreTests.swift'
      - 'WanderUITests/FeedPaginationUITests.swift'
      - 'WanderUITests/FeedAudienceUITests.swift'
      - 'WanderUITests/MapFilterInteractionUITests.swift'
      - 'scripts/run-parent-regression.py'
      - 'scripts/replay-simulator-fixture.py'
      - 'scripts/test_replay_simulator_fixture.py'
      - 'WanderUITests/FeedActivityGroupingUITests.swift'
      - 'WanderUITests/LiveReviewContinuityUITests.swift'
      - 'WanderUITests/SenderNotificationFlowUITests.swift'
      - 'WanderUITests/YourMapPrototypeUITests.swift'
      - '.github/workflows/feed-checkin-validation.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Validation mode
        type: choice
        options: [acceptance, rec636-profile-state-v57]
        default: acceptance
      expected_commit:
        description: Full reviewed commit for the isolated diagnostic
        type: string
        default: ''
      expected_tree:
        description: Full reviewed tree for the isolated diagnostic
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: feed-checkin-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'rec636-profile-state-v57' && format('-profile-state-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'rec636-profile-state-v57' }}

jobs:
  native:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'acceptance' }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
      - name: Generate project and select existing simulators
        run: |
          brew install xcodegen
          xcodegen generate
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          devices = json.loads((Path(os.environ['RUNNER_TEMP']) / 'devices.json').read_text())['devices']
          for names, key in [(('iPhone 17 Pro', 'iPhone 17'), 'LARGE_DEVICE_ID'),
                             (('iPhone 17e', 'iPhone 16e', 'iPhone SE (3rd generation)'), 'SMALL_DEVICE_ID')]:
              for name in names:
                  choices = [(tuple(map(int, re.findall(r'\d+', runtime))), d)
                             for runtime, rows in devices.items() if 'iOS' in runtime
                             for d in rows if d['name'] == name]
                  if choices:
                      device = sorted(choices, key=lambda item: item[0])[-1][1]
                      break
              else:
                  raise RuntimeError(f'No supported simulator for {key}')
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write(f'{key}={device["udid"]}\n')
              print('Testing on', device['name'])
          PY
      # Wall-clock budgets run on a controlled reference machine. The matching
      # deterministic search and high-data cache contracts still run below.
      # Functional UI tests use the same execution allowance as Parent and Live
      # continuity: XCTest's animation-idle waits count toward this allowance.
      # Element assertions and measured performance budgets remain unchanged.
      - name: Unit suite and native Feed scrolling
        run: >-
          xcodebuild test -quiet -project Wander.xcodeproj -scheme Wander
          -destination "platform=iOS Simulator,id=$LARGE_DEVICE_ID"
          -derivedDataPath "$RUNNER_TEMP/DerivedData" -jobs 2 -parallel-testing-enabled NO
          -only-testing:WanderTests
          -skip-testing:WanderTests/TrustedPlaceSearchTests/testSearchOneThousandMemoriesP95UnderFiftyMilliseconds
          -skip-testing:WanderTests/WanderPlaceCategoryTests/testPerformanceFixtureExercisesARealisticHighDataAccountWithinBudget
          -skip-testing:WanderTests/ReplayMaskingTests
          -only-testing:WanderUITests/FeedPaginationUITests
          -only-testing:WanderUITests/FeedAudienceUITests
          -only-testing:WanderUITests/MapFilterInteractionUITests/testMoreFiltersHidesMapDockAndBottomNavigationDismissesWithoutResetting
          -only-testing:WanderUITests/FeedActivityGroupingUITests/testFeedRatingsStayAtTopRightForShortAndLongPlaceNames
          -only-testing:WanderUITests/FeedActivityGroupingUITests/testFeedPhotoStackPagesAndReturnsWithoutOpeningProfileOrPlace
          -only-testing:WanderUITests/FeedActivityGroupingUITests/testFeedOmitsPhotoStackWhenSaveHasNoPhotos
          -only-testing:WanderUITests/FeedActivityGroupingUITests/testNotificationOpensPostWithArrowComposerAndBackReturnsFeed
          -only-testing:WanderUITests/FeedActivityGroupingUITests/testNotificationPostEdgeSwipeReturnsFeed
          -only-testing:WanderUITests/ForegroundEntryUITests
          -only-testing:WanderUITests/MapPlaceCardActionInteractionUITests/testActionButtonsCancelAfterDraggingAwayAndStillRespondToTaps
          -only-testing:WanderUITests/ShareCardMockupUITests/testExternalPlaceCanOpenNativeDestinationsFromEveryFormat
          -test-timeouts-enabled YES -default-test-execution-time-allowance 600
          -maximum-test-execution-time-allowance 900
          -resultBundlePath "$RUNNER_TEMP/large.xcresult" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES
      - name: Prepare isolated Replay test products once
        id: replay-products
        if: success() || failure()
        run: >-
          xcodebuild build-for-testing -quiet -project Wander.xcodeproj -scheme Wander
          -destination "platform=iOS Simulator,id=$LARGE_DEVICE_ID"
          -derivedDataPath "$RUNNER_TEMP/DerivedData" -jobs 2 -parallel-testing-enabled NO
          -testProductsPath "$RUNNER_TEMP/Replay.xctestproducts"
          -only-testing:WanderTests/ReplayMaskingTests
          CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES
      - name: Prepare fresh same-model Replay simulator
        id: replay-fixture
        if: ${{ !cancelled() && steps.replay-products.outcome == 'success' }}
        run: |
          python3 -B scripts/test_replay_simulator_fixture.py
          python3 -B scripts/replay-simulator-fixture.py prepare --source-device "$LARGE_DEVICE_ID"
      # Replay capture owns process-wide SDK state. Each scenario starts a fresh
      # test host on one dedicated same-model/runtime simulator; both remain required.
      - name: Verify private-message replay in an isolated process
        if: ${{ !cancelled() && steps.replay-products.outcome == 'success' && steps.replay-fixture.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("parent_regression", "scripts/run-parent-regression.py")
          regression = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(regression)
          root = Path(os.environ["RUNNER_TEMP"])
          suite = "replay-private"
          products = root / "Replay.xctestproducts"
          device = os.environ["REPLAY_DEVICE_ID"]
          bundle = root / (suite + ".xcresult")
          command = ["xcodebuild", "test-without-building", "-quiet", "-testProductsPath", str(products),
              "-destination", "platform=iOS Simulator,id=" + device,
              "-jobs", "2", "-parallel-testing-enabled", "NO",
              "-only-testing:WanderTests/ReplayMaskingTests/testPrivateMessageContentIsMaskedInActualReplayImage",
              "-resultBundlePath", str(bundle)]
          raise SystemExit(regression.run_isolated_replay(
              suite=suite, products=products, device_id=device, result_bundle=bundle,
              command=command, receipt=root / (suite + "-host.json")))
          PY
      - name: Verify credential replay in an isolated process
        if: ${{ !cancelled() && steps.replay-products.outcome == 'success' && steps.replay-fixture.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("parent_regression", "scripts/run-parent-regression.py")
          regression = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(regression)
          root = Path(os.environ["RUNNER_TEMP"])
          suite = "replay-credentials"
          products = root / "Replay.xctestproducts"
          device = os.environ["REPLAY_DEVICE_ID"]
          bundle = root / (suite + ".xcresult")
          command = ["xcodebuild", "test-without-building", "-quiet", "-testProductsPath", str(products),
              "-destination", "platform=iOS Simulator,id=" + device,
              "-jobs", "2", "-parallel-testing-enabled", "NO",
              "-only-testing:WanderTests/ReplayMaskingTests/testReadableContentAndCredentialMaskingInActualReplayImage",
              "-resultBundlePath", str(bundle)]
          raise SystemExit(regression.run_isolated_replay(
              suite=suite, products=products, device_id=device, result_bundle=bundle,
              command=command, receipt=root / (suite + "-host.json")))
          PY
      - name: Export Replay evidence before fixture cleanup
        id: replay-evidence
        if: ${{ always() && steps.replay-fixture.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          status=0
          for device in replay-private replay-credentials; do
            if [ -d "$RUNNER_TEMP/$device.xcresult" ]; then
              xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$device.xcresult" > "$RUNNER_TEMP/evidence/$device-summary.json" || status=1
              xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$device.xcresult" --output-path "$RUNNER_TEMP/evidence/$device" || status=1
            else
              status=1
            fi
          done
          exit "$status"
      - name: Clean up owned Replay simulator
        if: ${{ always() && steps.replay-fixture.outcome != 'skipped' }}
        env:
          REPLAY_EVIDENCE_EXPORTED: ${{ steps.replay-evidence.outcome == 'success' }}
        run: python3 -B scripts/replay-simulator-fixture.py cleanup
      - name: Stop large simulator
        if: ${{ always() && steps.replay-fixture.outcome == 'skipped' }}
        run: xcrun simctl shutdown "$LARGE_DEVICE_ID" || true
      - name: Verify scrolling on a compact phone
        if: success() || failure()
        run: >-
          xcodebuild test -quiet -project Wander.xcodeproj -scheme Wander
          -destination "platform=iOS Simulator,id=$SMALL_DEVICE_ID"
          -derivedDataPath "$RUNNER_TEMP/DerivedData" -jobs 2 -parallel-testing-enabled NO
          -only-testing:WanderUITests/FeedPaginationUITests
          -only-testing:WanderUITests/MapFilterInteractionUITests/testMoreFiltersHidesMapDockAndBottomNavigationDismissesWithoutResetting
          -only-testing:WanderUITests/FeedActivityGroupingUITests/testFeedRatingsStayAtTopRightForShortAndLongPlaceNames
          -only-testing:WanderUITests/FeedActivityGroupingUITests/testFeedPhotoStackPagesAndReturnsWithoutOpeningProfileOrPlace
          -only-testing:WanderUITests/FeedActivityGroupingUITests/testFeedOmitsPhotoStackWhenSaveHasNoPhotos
          -resultBundlePath "$RUNNER_TEMP/small.xcresult" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES
      - name: Generic Simulator build
        if: success() || failure()
        run: >-
          xcodebuild build -quiet -project Wander.xcodeproj -scheme Wander
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DerivedData" -jobs 2 CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES
      - name: Export native evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          for size in large small; do
            if [ -d "$RUNNER_TEMP/$size.xcresult" ]; then
              xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$size.xcresult" > "$RUNNER_TEMP/evidence/$size-summary.json" || true
              xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$size.xcresult" --output-path "$RUNNER_TEMP/evidence/$size" || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-checkin-native-evidence
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/large.xcresult
            ${{ runner.temp }}/small.xcresult
            ${{ runner.temp }}/replay-private.xcresult
            ${{ runner.temp }}/replay-credentials.xcresult
            ${{ runner.temp }}/replay-private-host.json
            ${{ runner.temp }}/replay-private-host
            ${{ runner.temp }}/replay-credentials-host.json
            ${{ runner.temp }}/replay-credentials-host
            ${{ runner.temp }}/replay-simulator-fixture
          retention-days: 14

  live-continuity:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'acceptance' }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
      - name: Generate project and select existing continuity simulators
        run: |
          brew install xcodegen
          xcodegen generate
          xcrun simctl list devices available --json > "$RUNNER_TEMP/live-continuity-devices.json"
          python3 - <<'PY_SETUP'
          import json, os, re
          from pathlib import Path
          devices = json.loads((Path(os.environ['RUNNER_TEMP']) / 'live-continuity-devices.json').read_text())['devices']
          for names, key in [(('iPhone 17 Pro', 'iPhone 17'), 'LARGE_DEVICE_ID'),
                             (('iPhone 17e', 'iPhone 16e', 'iPhone SE (3rd generation)'), 'SMALL_DEVICE_ID')]:
              for name in names:
                  choices = [(tuple(map(int, re.findall(r'\d+', runtime))), d)
                             for runtime, rows in devices.items() if 'iOS' in runtime
                             for d in rows if d['name'] == name]
                  if choices:
                      device = sorted(choices, key=lambda item: item[0])[-1][1]
                      break
              else:
                  raise RuntimeError(f'No supported simulator for {key}')
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write(f'{key}={device["udid"]}\n')
              print('Continuity on', device['name'])
          PY_SETUP
      - name: Build signed continuity test harness once
        id: continuity-build
        run: |
          xcodebuild build-for-testing -quiet -project Wander.xcodeproj -scheme Wander \
            -destination "platform=iOS Simulator,id=$LARGE_DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/LiveContinuityDerivedData" -jobs 2 -parallel-testing-enabled NO \
            -only-testing:WanderUITests/LiveReviewContinuityUITests \
            -only-testing:WanderUITests/LiveDrawerAndFilterUITests \
            -only-testing:WanderUITests/SenderNotificationFlowUITests/testLargeTextAndDarkNativeControls \
            -only-testing:WanderUITests/YourMapPrototypeUITests/testAdaptiveMapKeepsEveryPlaceAndExpandsAllDotsAtCloseZoom \
            -resultBundlePath "$RUNNER_TEMP/live-continuity-build.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES \
            > "$RUNNER_TEMP/live-continuity-build.log" 2>&1
          python3 - <<'PY_RUNFILE'
          import os
          from pathlib import Path
          products = Path(os.environ['RUNNER_TEMP']) / 'LiveContinuityDerivedData/Build/Products'
          candidates = list(products.glob('Wander_iphonesimulator*-arm64.xctestrun'))
          if len(candidates) != 1:
              raise RuntimeError('Expected exactly one generated continuity xctestrun')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'LIVE_CONTINUITY_XCTESTRUN={candidates[0]}\n')
          PY_RUNFILE
      - name: Verify integrated Live continuity on large phone
        run: >-
          xcodebuild test-without-building -quiet -xctestrun "$LIVE_CONTINUITY_XCTESTRUN"
          -destination "platform=iOS Simulator,id=$LARGE_DEVICE_ID"
          -jobs 1 -parallel-testing-enabled NO
          -only-testing:WanderUITests/LiveReviewContinuityUITests
          -only-testing:WanderUITests/LiveDrawerAndFilterUITests
          -only-testing:WanderUITests/SenderNotificationFlowUITests/testLargeTextAndDarkNativeControls
          -only-testing:WanderUITests/YourMapPrototypeUITests/testAdaptiveMapKeepsEveryPlaceAndExpandsAllDotsAtCloseZoom
          -test-timeouts-enabled YES -default-test-execution-time-allowance 600
          -maximum-test-execution-time-allowance 900
          -resultBundlePath "$RUNNER_TEMP/live-continuity-large.xcresult"
          > "$RUNNER_TEMP/live-continuity-large.log" 2>&1
      - name: Release large simulator and prepare compact phone
        if: ${{ !cancelled() && steps.continuity-build.outcome == 'success' }}
        run: |
          if xcrun simctl list devices booted --json | python3 -c 'import json,os,sys; sys.exit(not any(d["udid"] == os.environ["LARGE_DEVICE_ID"] for rows in json.load(sys.stdin)["devices"].values() for d in rows))'; then
            xcrun simctl shutdown "$LARGE_DEVICE_ID"
          fi
          xcrun simctl bootstatus "$SMALL_DEVICE_ID" -b
      - name: Verify integrated Live continuity on compact phone
        if: ${{ !cancelled() && steps.continuity-build.outcome == 'success' }}
        run: >-
          xcodebuild test-without-building -quiet -xctestrun "$LIVE_CONTINUITY_XCTESTRUN"
          -destination "platform=iOS Simulator,id=$SMALL_DEVICE_ID"
          -jobs 1 -parallel-testing-enabled NO
          -only-testing:WanderUITests/LiveReviewContinuityUITests
          -only-testing:WanderUITests/LiveDrawerAndFilterUITests
          -only-testing:WanderUITests/SenderNotificationFlowUITests/testLargeTextAndDarkNativeControls
          -only-testing:WanderUITests/YourMapPrototypeUITests/testAdaptiveMapKeepsEveryPlaceAndExpandsAllDotsAtCloseZoom
          -test-timeouts-enabled YES -default-test-execution-time-allowance 600
          -maximum-test-execution-time-allowance 900
          -resultBundlePath "$RUNNER_TEMP/live-continuity-compact.xcresult"
          > "$RUNNER_TEMP/live-continuity-compact.log" 2>&1
      - name: Export and verify continuity evidence
        if: always()
        run: |
          python3 - <<'PY_EVIDENCE'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          evidence = root / 'live-continuity-evidence'
          evidence.mkdir()
          (evidence / 'expected-coverage.json').write_text(json.dumps({
              'testClasses': ['LiveReviewContinuityUITests', 'LiveDrawerAndFilterUITests'], 'expectedCasesPerDevice': 8,
              'requiredRegressionCases': ['SenderNotificationFlowUITests/testLargeTextAndDarkNativeControls()',
                                        'YourMapPrototypeUITests/testAdaptiveMapKeepsEveryPlaceAndExpandsAllDotsAtCloseZoom()'],
              'devices': ['large', 'compact'], 'allSelectedCasesMustPass': True}, indent=2) + '\n')
          problems = []
          for label in ['large', 'compact']:
              counts = {}
              bundle = root / f'live-continuity-{label}.xcresult'
              if not bundle.is_dir():
                  problems.append(f'{label}: result bundle missing')
                  continue
              summary = subprocess.run(['xcrun', 'xcresulttool', 'get', 'test-results', 'summary', '--path', str(bundle), '--compact'], capture_output=True, text=True)
              (evidence / f'{label}-summary.json').write_text(summary.stdout)
              (evidence / f'{label}-summary-errors.log').write_text(summary.stderr)
              if summary.returncode != 0:
                  problems.append(f'{label}: summary export failed')
              else:
                  try:
                      parsed_counts = json.loads(summary.stdout)
                      if not isinstance(parsed_counts, dict):
                          raise ValueError('Expected a test summary object')
                      counts = parsed_counts
                      if not (counts.get('result') == 'Passed' and counts.get('passedTests') == 8
                              and counts.get('totalTestCount') == counts.get('passedTests')
                              and counts.get('failedTests') == 0 and counts.get('skippedTests') == 0
                              and counts.get('expectedFailures') == 0):
                          problems.append(f'{label}: incomplete passing class result')
                  except (ValueError, TypeError):
                      problems.append(f'{label}: invalid summary')
              tests = subprocess.run(['xcrun', 'xcresulttool', 'get', 'test-results', 'tests', '--path', str(bundle), '--compact'], capture_output=True, text=True)
              (evidence / f'{label}-tests.json').write_text(tests.stdout)
              (evidence / f'{label}-tests-errors.log').write_text(tests.stderr)
              if tests.returncode != 0:
                  problems.append(f'{label}: named-test export failed')
              else:
                  try:
                      def nodes(value):
                          if isinstance(value, dict):
                              yield value
                              for child in value.values():
                                  yield from nodes(child)
                          elif isinstance(value, list):
                              for child in value:
                                  yield from nodes(child)
                      cases = [node for node in nodes(json.loads(tests.stdout)) if node.get('nodeType') == 'Test Case']
                      required = ['SenderNotificationFlowUITests/testLargeTextAndDarkNativeControls()',
                                  'YourMapPrototypeUITests/testAdaptiveMapKeepsEveryPlaceAndExpandsAllDotsAtCloseZoom()']
                      required_continuity = [
                          'LiveReviewContinuityUITests/testLiveFilterSurvivesProfileYourMapSavedPlaceAndPatternsReturn()',
                          'LiveReviewContinuityUITests/testPinShowsItsOriginalFeedActivityAndOpensItsPlaceWithReturn()',
                          'LiveReviewContinuityUITests/testEmbeddedFeedKeepsInvitePeopleActivityOrderAndProfileReturn()',
                          'LiveReviewContinuityUITests/testLiveSearchNotificationsAndAddCancelReturnToSameSurface()',
                          'LiveDrawerAndFilterUITests/testEveryDrawerDetentAndNativeMapPanKeepTheLoadedActivity()',
                          'LiveDrawerAndFilterUITests/testCombinedFiltersApplyCancelAndResetKeepMapAndFeedInAgreement()']
                      by_id = {}
                      for node in cases:
                          identifier = '/'.join(str(node.get('nodeIdentifier', '')).split('/')[-2:])
                          by_id.setdefault(identifier, []).append(node)
                      regression = {identifier: len(by_id.get(identifier, [])) == 1
                                    and by_id[identifier][0].get('result') == 'Passed' for identifier in required}
                      continuity = [node for identifier, matches in by_id.items()
                                    if identifier in required_continuity for node in matches]
                      continuity_required = {identifier: len(by_id.get(identifier, [])) == 1
                                             and by_id[identifier][0].get('result') == 'Passed' for identifier in required_continuity}
                      proof = {'requiredRegressionCases': regression, 'requiredContinuityCases': continuity_required,
                               'continuityCaseCount': len(continuity),
                               'continuityAllPassed': len(continuity) == 6 and all(node.get('result') == 'Passed' for node in continuity),
                               'allSelectedCasesAccountedFor': len(cases) == 8
                                   and set(by_id) == set(required + required_continuity)
                                   and len(cases) == len(continuity) + len(required)
                                   and len(cases) == counts.get('totalTestCount')
                                   and all(len(value) == 1 for value in by_id.values())
                                   and all(node.get('result') == 'Passed' for node in cases)}
                      (evidence / f'{label}-named-case-proof.json').write_text(json.dumps(proof, indent=2) + '\n')
                      if not all(regression.values()) or not all(continuity_required.values()) or not proof['continuityAllPassed'] or not proof['allSelectedCasesAccountedFor']:
                          problems.append(f'{label}: required named cases did not all pass')
                  except (ValueError, TypeError):
                      problems.append(f'{label}: invalid named-test export')
              with (evidence / f'{label}-attachment-export.log').open('w') as log:
                  exported = subprocess.run(['xcrun', 'xcresulttool', 'export', 'attachments', '--path', str(bundle), '--output-path', str(evidence / label)], stdout=log, stderr=subprocess.STDOUT)
              if exported.returncode != 0:
                  problems.append(f'{label}: attachment export failed')
          if problems:
              raise SystemExit('; '.join(problems))
          PY_EVIDENCE
      - name: Save integrated Live continuity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-continuity-native-evidence
          path: |
            ${{ runner.temp }}/live-continuity-evidence
            ${{ runner.temp }}/live-continuity-build.xcresult
            ${{ runner.temp }}/live-continuity-large.xcresult
            ${{ runner.temp }}/live-continuity-compact.xcresult
            ${{ runner.temp }}/live-continuity-*.log
          retention-days: 14

  rec636-profile-state-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'rec636-profile-state-v57' }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          lfs: true
      - name: Admit exact isolated source, Xcode and large simulator
        id: diagnostic-admission
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
        run: |
          python3 - <<'PY_ADMIT'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          def command(*args):
              return subprocess.check_output(args, text=True, timeout=30).strip()
          def require(value, message):
              if not value: raise SystemExit(message)
          out = Path(os.environ['RUNNER_TEMP']) / 'rec636-profile-state'
          out.mkdir()
          (out/'request.json').write_text(json.dumps({'scope':'diagnostic_only_not_acceptance','mode':'rec636-profile-state-v57','runId':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT']},indent=2)+'\n')
          base = '498f7bbf60a396ab9ecfdd9de5ab4b83985dcfc4'
          require(os.environ['GITHUB_REF'] == 'refs/heads/codex/rec636-v57-profile-state-diagnostic', 'Diagnostic branch mismatch')
          require(os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'One original diagnostic attempt only')
          head, tree = command('git','rev-parse','HEAD'), command('git','rev-parse','HEAD^{tree}')
          require(re.fullmatch('[0-9a-f]{40}',os.environ['EXPECTED_COMMIT']) and re.fullmatch('[0-9a-f]{40}',os.environ['EXPECTED_TREE']), 'Full reviewed commit/tree required')
          require(head == os.environ['EXPECTED_COMMIT'] == os.environ['GITHUB_SHA'] and tree == os.environ['EXPECTED_TREE'], 'Diagnostic source mismatch')
          require(command('git','show','-s','--format=%P','HEAD') == base, 'One diagnostic commit directly above V57 required')
          require(command('git','rev-parse',base+'^{tree}') == '2f65913ba01fe2543b625f66f3f797d1a6f525bb', 'V57 base tree mismatch')
          require(not command('git','status','--porcelain'), 'Unexpected checkout changes')
          proposed = {'Wander/Features/Profile/ProfileHeaderMotion.swift': 'ea1188757b00bd2271b8f17df5ae005900c7c855176bc3920fb132c1abbc30bf', 'Wander/App/WanderApp.swift': 'efcedbea6081b5a8779ea2522af645a9eaec3f67e04fcf32b2a145649660cdad', 'WanderUITests/PlaceProfileAppearanceUITests.swift': 'efb467e4ab9a84278d97b64cdc6d89df374e2510983ddc4c557a9a14cdf0c365'}
          workflow = '.github/workflows/feed-checkin-validation.yml'
          require(set(command('git','diff','--name-only',base,'HEAD').splitlines()) == set(proposed)|{workflow}, 'Unexpected scope: exactly three passive Swift files and this workflow required')
          sources = list(proposed) + [workflow,'Wander.xcodeproj/project.pbxproj','project.yml',
              'Wander.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved',
              'Wander/Resources/FoundersWelcome/founders-welcome.mp4','Wander/App/WanderRootView.swift',
              'Wander/Features/Profile/ProfileScreen.swift','Wander/Features/Profile/ProfileOwnerHome.swift',
              'Wander/Features/Settings/SettingsScreen.swift','Wander/Features/Events/EventsComingSoonScreen.swift',
              'WanderTests/ReplayMaskingTests.swift']
          hashes = {p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in sources}
          require(all(hashes[p] == digest for p,digest in proposed.items()), 'Reviewed patch bytes changed')
          for p in sources:
              blob = subprocess.check_output(['git','show','HEAD:'+p],timeout=30)
              if p.endswith('.mp4'):
                  pointer = blob.decode('ascii')
                  oid = re.search(r'^oid sha256:([0-9a-f]{64})$',pointer,re.M)
                  size = re.search(r'^size (\d+)$',pointer,re.M)
                  require(oid and size and hashes[p] == oid[1] and Path(p).stat().st_size == int(size[1]), 'Required media not hydrated to its committed LFS identity')
              else:
                  require(hashlib.sha256(blob).hexdigest() == hashes[p], 'Checkout differs from committed source: '+p)
          version = command('xcodebuild','-version').splitlines()
          require(version == ['Xcode 26.6','Build version 17F113'], 'Reference Xcode unavailable; no fallback')
          runtime = 'com.apple.CoreSimulator.SimRuntime.iOS-26-5'
          runtimes = json.loads(command('xcrun','simctl','list','runtimes','--json'))['runtimes']
          matches = [x for x in runtimes if x.get('identifier') == runtime and x.get('isAvailable')]
          require(len(matches) == 1 and matches[0].get('version') == '26.5' and matches[0].get('buildversion') == '23F77', 'Reference runtime unavailable; no fallback')
          devices = json.loads(command('xcrun','simctl','list','devices','available','--json'))['devices'].get(runtime,[])
          matches = [x for x in devices if x.get('name') == 'iPhone 17 Pro' and x.get('isAvailable')]
          require(len(matches) == 1, 'Exact unique reference phone required')
          device = {'name':'iPhone 17 Pro','udid':matches[0]['udid'],'runtime':runtime,'runtimeBuild':'23F77'}
          receipt = {'scope':'diagnostic_only_not_acceptance','baseCommit':base,'head':head,'tree':tree,'runId':os.environ['GITHUB_RUN_ID'],'attempt':1,'xcode':version,'device':device,'sourceSHA256':hashes,'diagnosticMode':'rec636-profile-state-v57','plannedExecutions':1,'retryEnabled':False}
          (out/'source-toolchain.json').write_text(json.dumps(receipt,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as env: env.write('DIAGNOSTIC_LARGE='+device['udid']+'\n')
          PY_ADMIT
      - name: Build the committed diagnostic harness once
        id: diagnostic-build
        run: |
          git diff --exit-code -- project.yml Wander.xcodeproj/project.pbxproj
          xcodebuild build-for-testing -quiet -project Wander.xcodeproj -scheme Wander \
            -destination "platform=iOS Simulator,id=$DIAGNOSTIC_LARGE" \
            -derivedDataPath "$RUNNER_TEMP/REC636ProfileStateDerivedData" -jobs 2 -parallel-testing-enabled NO \
            -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution \
            -only-testing:WanderUITests/PlaceProfileAppearanceUITests/testPrimaryScreensAndPresentedSurfacesSurviveAppearanceChanges \
            -resultBundlePath "$RUNNER_TEMP/rec636-profile-state/build.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES
          python3 - <<'PY_PRODUCTS'
          import os
          from pathlib import Path
          files = list((Path(os.environ['RUNNER_TEMP'])/'REC636ProfileStateDerivedData/Build/Products').glob('Wander_iphonesimulator*-arm64.xctestrun'))
          if len(files) != 1: raise SystemExit('Expected one exact xctestrun')
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('DIAGNOSTIC_XCTESTRUN='+str(files[0])+'\n')
          PY_PRODUCTS
      - name: Attach the selected simulator display for actual compositor captures
        id: diagnostic-display
        run: |
          python3 - <<'PY_DISPLAY'
          import os, subprocess
          subprocess.run(['xcrun','simctl','bootstatus',os.environ['DIAGNOSTIC_LARGE'],'-b'],check=True,timeout=180)
          subprocess.run(['open','-a','Simulator','--args','-CurrentDeviceUDID',os.environ['DIAGNOSTIC_LARGE']],check=True,timeout=30)
          PY_DISPLAY
      - name: Prepare exact native result accounting
        if: ${{ !cancelled() && steps.diagnostic-admission.outcome == 'success' }}
        run: |
          cat > "$RUNNER_TEMP/rec636-profile-state/audit-native.py" <<'PY_AUDIT'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'rec636-profile-state'
          admitted=json.loads((out/'source-toolchain.json').read_text())
          expected={'appearance':['PlaceProfileAppearanceUITests/testPrimaryScreensAndPresentedSurfacesSurviveAppearanceChanges()']}
          def nodes(value):
              if isinstance(value,dict):
                  yield value
                  for child in value.values(): yield from nodes(child)
              elif isinstance(value,list):
                  for child in value: yield from nodes(child)
          def audit(group):
              record=out/(group+'-audit.json')
              if record.exists(): raise SystemExit('Refusing repeated native export: '+group)
              bundle=out/(group+'.xcresult'); methods=expected[group]; problems=[]; exports={}
              if bundle.is_dir():
                  for kind in ['summary','tests']:
                      try:
                          raw=subprocess.check_output(['xcrun','xcresulttool','get','test-results',kind,'--path',str(bundle),'--compact'],timeout=90)
                          exports[kind]=json.loads(raw)
                          with (out/(group+'-'+kind+'.json')).open('xb') as destination: destination.write(raw)
                      except (subprocess.SubprocessError,OSError,ValueError): problems.append(kind+'_export')
              else: problems.append('native_bundle_missing')
              result={'group':group,'required':methods,'allPassed':False,'nativeOutcomesUnchanged':True,'gaps':problems}
              if set(exports)=={'summary','tests'}:
                  summary=exports['summary']; cases=[x for x in nodes(exports['tests']) if x.get('nodeType')=='Test Case']
                  actual=[{'method':'/'.join(str(x.get('nodeIdentifier','')).split('/')[-2:]),'url':x.get('nodeIdentifierURL'),'result':x.get('result')} for x in cases]
                  exact=sorted(x['method'] for x in actual)==sorted(methods) and len(cases)==summary.get('totalTestCount') and all(x['url']=='test://com.apple.xcode/Wander/WanderUITests/'+x['method'].removesuffix('()') for x in actual)
                  selected=admitted['device']
                  device={'architecture':'arm64','deviceId':selected['udid'],'deviceName':'iPhone 17 Pro','modelName':'iPhone 17 Pro','osBuildNumber':'23F77','osVersion':'26.5','platform':'iOS Simulator'}
                  configurations=summary.get('devicesAndConfigurations',[])
                  device_matches=selected['name']=='iPhone 17 Pro' and selected['runtime']=='com.apple.CoreSimulator.SimRuntime.iOS-26-5' and selected['runtimeBuild']=='23F77' and exports['tests'].get('devices')==[device] and len(configurations)==1 and configurations[0].get('device')==device
                  keys={'Passed':'passedTests','Failed':'failedTests','Skipped':'skippedTests','Expected Failure':'expectedFailures'}
                  counts=all(x['result'] in keys for x in actual) and all(summary.get(k)==sum(x['result']==s for x in actual) for s,k in keys.items()) and len(configurations)==1 and all(configurations[0].get(k)==summary.get(k) for k in keys.values())
                  passed=exact and device_matches and counts and summary.get('result')=='Passed' and summary.get('passedTests')==len(methods) and all(summary.get(k)==0 for k in ['failedTests','skippedTests','expectedFailures'])
                  if not exact: problems.append('native_roster_gap')
                  if not device_matches: problems.append('native_device_gap')
                  if not counts: problems.append('native_counts_gap')
                  if not passed: problems.append('native_failed_or_incomplete')
                  result.update(actual=actual,actualDevice=device,exactCoverage=exact,deviceMatchesAdmission=device_matches,nativeCountsMatchTreeAndDevice=counts,allPassed=passed,nativeStartTime=summary.get('startTime'),nativeFinishTime=summary.get('finishTime'),exportSHA256={k:hashlib.sha256((out/(group+'-'+k+'.json')).read_bytes()).hexdigest() for k in exports})
              with record.open('x') as destination: destination.write(json.dumps(result,indent=2)+'\n')
              return result
          if sys.argv[1]!='final': raise SystemExit('Unknown audit mode')
          problems=[]
          try:
              same={p:hashlib.sha256(Path(p).read_bytes()).hexdigest()==digest for p,digest in admitted['sourceSHA256'].items()}
              actual_head=subprocess.check_output(['git','rev-parse','HEAD'],text=True,timeout=30).strip()
              actual_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True,timeout=30).strip()
              clean=not subprocess.check_output(['git','status','--porcelain'],text=True,timeout=30).strip()
              (out/'source-postflight.json').write_text(json.dumps({'unchanged':same,'head':actual_head,'tree':actual_tree,'checkoutClean':clean},indent=2)+'\n')
              if not all(same.values()) or actual_head!=admitted['head'] or actual_tree!=admitted['tree'] or not clean: problems.append('source_drift')
          except (OSError,ValueError,KeyError,subprocess.SubprocessError): problems.append('source_postflight_unavailable')
          records={'appearance':audit('appearance')}
          process_outcomes={'appearance':os.environ.get('APPEARANCE_NATIVE_OUTCOME','unknown')}
          if process_outcomes['appearance']!='success': problems.append('appearance_native_process_not_successful')
          if not records['appearance'].get('allPassed'): problems.append('appearance_native_failed_or_not_executed')
          # Native and passive-observation evidence remain separate. Missing or late
          # teardown attachments cannot establish coverage or become a native pass.
          receipt={'scope':'diagnostic_only_not_acceptance','nativeOutcomesUnchanged':True,
              'diagnosticMode':'rec636-profile-state-v57','plannedExecutions':1,
              'requiredExecutedCount':1,'nativeProcessOutcomes':process_outcomes,'groups':records,
              'gaps':problems,'observationStatus':'pending_original_attachment_review',
              'observationRequiredForInterpretation':True,'diagnosticAcceptance':False}
          (out/'diagnostic-accounting.json').write_text(json.dumps(receipt,indent=2)+'\n')
          if problems: raise SystemExit('Diagnostic native failure or gap: '+','.join(problems))
          PY_AUDIT
      - name: Observe the unchanged original appearance journey once
        id: diagnostic-appearance
        if: ${{ !cancelled() && steps.diagnostic-build.outcome == 'success' && steps.diagnostic-display.outcome == 'success' }}
        run: >-
          xcodebuild test-without-building -quiet -xctestrun "$DIAGNOSTIC_XCTESTRUN"
          -destination "platform=iOS Simulator,id=$DIAGNOSTIC_LARGE" -jobs 1 -parallel-testing-enabled NO
          -only-testing:WanderUITests/PlaceProfileAppearanceUITests/testPrimaryScreensAndPresentedSurfacesSurviveAppearanceChanges
          -test-timeouts-enabled YES -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 900
          -resultBundlePath "$RUNNER_TEMP/rec636-profile-state/appearance.xcresult"
      - name: Preserve original outcome and exact source/device coverage
        if: ${{ always() && steps.diagnostic-admission.outcome == 'success' }}
        env:
          APPEARANCE_NATIVE_OUTCOME: ${{ steps.diagnostic-appearance.outcome }}
        run: python3 "$RUNNER_TEMP/rec636-profile-state/audit-native.py" final
      - name: Retain original diagnostic result bundles and observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rec636-profile-state-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/rec636-profile-state
          retention-days: 14
          if-no-files-found: error
