name: REC-636 onboarding input diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rec636-onboarding-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - name: Prepare exact source and original Parent display conditions
        run: |
          brew install xcodegen
          xcodegen generate
          python3 -B -m unittest discover -s scripts/diagnostics -p 'test_*.py'
          python3 - <<'PY_SETUP'
          import json, os, re, subprocess
          from pathlib import Path
          rows=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          choices=[(tuple(map(int,re.findall(r'\d+',runtime))),d) for runtime,devices in rows.items() if 'iOS' in runtime for d in devices if d['name']=='iPhone 17 Pro']
          if not choices: raise RuntimeError('Required existing simulator missing')
          device=max(choices,key=lambda x:x[0])[1]['udid']
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('LARGE_DEVICE_ID='+device+'\n')
          out=Path(os.environ['RUNNER_TEMP'])/'rec636-diagnostic';out.mkdir()
          (out/'source.json').write_text(json.dumps({'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'device':device,'method':'WanderUITests/OnboardingUITests/testNativeMapOverviewUsesRealControlsAndEndsWithoutSaving','scope':'diagnostic-only; no final acceptance'},indent=2))
          subprocess.run(['xcrun','simctl','bootstatus',device,'-b'],check=True)
          subprocess.run(['xcrun','simctl','ui',device,'appearance','dark'],check=True)
          subprocess.run(['xcrun','simctl','ui',device,'appearance','light'],check=True)
          subprocess.run(['xcrun','simctl','shutdown',device],check=True)
          subprocess.run(['xcrun','simctl','bootstatus',device,'-b'],check=True)
          subprocess.run(['open','-a','Simulator','--args','-CurrentDeviceUDID',device],check=True)
          PY_SETUP
      - name: Build diagnostic products once
        id: products
        run: |
          xcodebuild build-for-testing -quiet -project Wander.xcodeproj -scheme Wander \
            -destination "platform=iOS Simulator,id=$LARGE_DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" -jobs 2 \
            -parallel-testing-enabled NO \
            -testProductsPath "$RUNNER_TEMP/Diagnostic.xctestproducts" \
            -resultBundlePath "$RUNNER_TEMP/rec636-diagnostic/build.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- GENERATE_INFOPLIST_FILE=YES
      - name: Observe the original map to feed onboarding journey once
        if: ${{ !cancelled() && steps.products.outcome == 'success' }}
        run: |
          python3 - <<'PY_NATIVE'
          import hashlib, json, os, plistlib, runpy, subprocess, time
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);products=root/'Diagnostic.xctestproducts';out=root/'rec636-diagnostic'
          entries=plistlib.loads((products/'Info.plist').read_bytes())['Tests']
          paths=set()
          for entry in entries:
              candidate=products/entry['xctestrun'];path=candidate.resolve()
              assert not candidate.is_symlink() and path.is_relative_to(products.resolve())
              paths.add(path)
          originals={p:p.read_bytes() for p in paths};code=2
          (out/'onboarding-overview-start.txt').write_text(str(time.time()))
          try:
              runner=runpy.run_path('scripts/run-parent-regression.py')
              runner['prepare_ui_performance_products'](products,preserve_system_failures=True)
              code=subprocess.run(['xcodebuild','test-without-building','-quiet','-testProductsPath',str(products),
                  '-destination','platform=iOS Simulator,id='+os.environ['LARGE_DEVICE_ID'],
                  '-jobs','2','-parallel-testing-enabled','NO',
                  '-only-testing:WanderUITests/OnboardingUITests/testNativeMapOverviewUsesRealControlsAndEndsWithoutSaving',
                  '-test-timeouts-enabled','YES','-default-test-execution-time-allowance','600',
                  '-maximum-test-execution-time-allowance','900',
                  '-resultBundlePath',str(out/'onboarding-overview.xcresult')]).returncode
          finally:
              for path,data in originals.items(): path.write_bytes(data)
              assert all(p.read_bytes()==data for p,data in originals.items())
              (out/'onboarding-configuration.json').write_text(json.dumps({'restored':True,'nativeExitCode':code,
                  'originalSHA256':{str(p.relative_to(products)):hashlib.sha256(data).hexdigest() for p,data in originals.items()}}))
          raise SystemExit(code)
          PY_NATIVE
      - name: Retain only the synthetic onboarding input and fixed stage trace
        if: ${{ !cancelled() && steps.products.outcome == 'success' }}
        env:
          TRACE_DEVICE_KEY: LARGE_DEVICE_ID
          TRACE_NAME: onboarding-overview
        run: python3 -B scripts/diagnostics/export-native-input-trace.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rec636-onboarding-diagnostic
          path: ${{ runner.temp }}/rec636-diagnostic
          retention-days: 7
          if-no-files-found: error
