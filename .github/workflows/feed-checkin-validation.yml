          try:
              admitted=json.loads((out/'source-toolchain.json').read_text())
              same={p:hashlib.sha256(Path(p).read_bytes()).hexdigest()==sha for p,sha in admitted['sourceSHA256'].items()}
              (out/'source-postflight.json').write_text(json.dumps({'unchanged':same},indent=2)+'\n')
              if not all(same.values()): problems.append('source_drift')
          except (OSError,ValueError,KeyError): problems.append('source_admission_or_postflight_unavailable')
          expected={size:['LiveDrawerAndFilterUITests/testCombinedFiltersApplyCancelAndResetKeepMapAndFeedInAgreement()'] for size in ['large','compact']}
          def nodes(value):
              if isinstance(value,dict):
                  yield value
                  for child in value.values(): yield from nodes(child)
              elif isinstance(value,list):
                  for child in value: yield from nodes(child)
          records={}
          for size, methods in expected.items():
              bundle=out/(size+'.xcresult')
              if not bundle.is_dir():
                  records[size]={'status':'missing','required':methods}; problems.append(size+'_missing'); continue
              exports={}
              for kind in ['summary','tests']:
                  try:
                      raw=subprocess.check_output(['xcrun','xcresulttool','get','test-results',kind,'--path',str(bundle),'--compact'],timeout=90)
                      exports[kind]=json.loads(raw)
                      (out/(size+'-'+kind+'.json')).write_bytes(raw)
                  except (subprocess.SubprocessError,OSError,ValueError): problems.append(size+'_'+kind+'_export')
              if set(exports)!= {'summary','tests'}: continue
              cases=[x for x in nodes(exports['tests']) if x.get('nodeType')=='Test Case']
              actual=[{'method':'/'.join(str(x.get('nodeIdentifier','')).split('/')[-2:]),'result':x.get('result')} for x in cases]
              summary=exports['summary']
              exact=sorted(x['method'] for x in actual)==sorted(methods) and len(cases)==summary.get('totalTestCount')
              selected=admitted.get('devices',{}).get(size,{})
              model = 'iPhone 17 Pro' if size == 'large' else 'iPhone 17e'
              expected_device={'architecture':'arm64','deviceId':selected.get('udid'),
                  'deviceName':model,'modelName':model,'osBuildNumber':'23F77',
                  'osVersion':'26.5','platform':'iOS Simulator'}
              configurations=summary.get('devicesAndConfigurations',[])
              device_matches=bool(selected.get('udid')) and selected.get('name')==model and selected.get('runtime')=='com.apple.CoreSimulator.SimRuntime.iOS-26-5' and selected.get('runtimeBuild')=='23F77' and exports['tests'].get('devices')==[expected_device] and len(configurations)==1 and configurations[0].get('device')==expected_device
              count_keys={'Passed':'passedTests','Failed':'failedTests','Skipped':'skippedTests','Expected Failure':'expectedFailures'}
              counts_match=all(x['result'] in count_keys for x in actual) and all(summary.get(key)==sum(x['result']==status for x in actual) for status,key in count_keys.items())
              device_counts_match=len(configurations)==1 and all(configurations[0].get(key)==summary.get(key) for key in count_keys.values())
              if not device_matches: problems.append(size+'_device_identity_gap')
              if not counts_match or not device_counts_match: problems.append(size+'_native_count_gap')
              passed=exact and device_matches and counts_match and device_counts_match and all(x['result']=='Passed' for x in actual) and summary.get('result')=='Passed' and summary.get('passedTests')==len(methods) and all(summary.get(k)==0 for k in ['failedTests','skippedTests','expectedFailures'])
              records[size]={'required':methods,'actual':actual,'exactCoverage':exact,'deviceMatchesAdmission':device_matches,'nativeCountsMatchTreeAndDevice':counts_match and device_counts_match,'allPassed':passed,'summarySHA256':hashlib.sha256((out/(size+'-summary.json')).read_bytes()).hexdigest(),'testsSHA256':hashlib.sha256((out/(size+'-tests.json')).read_bytes()).hexdigest()}
              if not passed: problems.append(size+'_native_failed_or_incomplete')
          (out/'diagnostic-accounting.json').write_text(json.dumps({'scope':'diagnostic_only_not_acceptance','nativeOutcomesUnchanged':True,'diagnosticMode':'rec636-contact-v57','expectedExecutions':2,'devices':records,'gaps':problems},indent=2)+'\n')
          if problems: raise SystemExit('Diagnostic failure or gap: '+','.join(problems))
          PY_RESULTS
      - name: Retain original diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
